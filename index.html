  function emptyState() {
    return {
      version: 1,
      cards: [],
      srs: {},
      seen: {},
      log: [],
      daily: {},
      seeded: false,
      wiped: false,
      settings: { mode: 'sense', limit: 20, autoSpeak: true },
      created: now()
    };
  }
  let state = emptyState();

  function seedState() {
    const base = emptyState();
    if (Array.isArray(SEED_CARDS) && SEED_CARDS.length) {
      base.cards = JSON.parse(JSON.stringify(SEED_CARDS));
      base.seeded = true;
      base._justSeeded = true;
    }
    return base;
  }

  function loadState() {
    let st = null;
    try {
      const raw = global.localStorage && localStorage.getItem(LS_KEY);
      if (raw) st = JSON.parse(raw);
    } catch (e) { st = null; }
    if (!st) return seedState();
    const base = emptyState();
    const merged = Object.assign(base, st);
    merged.settings = Object.assign(base.settings, st.settings || {});
    if (!Array.isArray(merged.cards)) merged.cards = [];
    if (!merged.srs || typeof merged.srs !== 'object') merged.srs = {};
    if (!merged.seen || typeof merged.seen !== 'object') merged.seen = {};
    if (!Array.isArray(merged.log)) merged.log = [];
    if (!merged.daily || typeof merged.daily !== 'object') merged.daily = {};
    // 空词库 + 没主动清空过 → 自动装入内置词库
    if (!merged.wiped && merged.cards.length === 0 && Array.isArray(SEED_CARDS) && SEED_CARDS.length) {
      merged.cards = JSON.parse(JSON.stringify(SEED_CARDS));
      merged.seeded = true;
      merged._justSeeded = true;
    }
    return merged;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式 */ }
  }
  function dailyBucket() {
    const k = todayKey();
    if (!state.daily[k]) state.daily[k] = { seen: 0, correct: 0, wrong: 0, words: 0 };
    return state.daily[k];
  }

  /* ============ 3. 学习项 & 记忆调度 ============ */
  function itemKey(card, sense) { return card.id + '::' + normCn(sense.cn); }

  function collectItems() {
    const out = [];
    state.cards.forEach((card) => {
      (card.senses || []).forEach((sense, i) => {
        const key = itemKey(card, sense);
        out.push({ card: card, sense: sense, idx: i, key: key, rec: state.srs[key] || null });
      });
    });
    return out;
  }

  function isNew(rec) { return !rec || !rec.seen; }

  function sortForReview(pool) {
    const due = [], fresh = [], later = [];
    pool.forEach((it) => {
      if (isNew(it.rec)) fresh.push(it);
      else if (it.rec.due <= now()) due.push(it);
      else later.push(it);
    });
    due.sort((a, b) => a.rec.due - b.rec.due);
    shuffle(fresh);
    later.sort((a, b) => (a.rec.box - b.rec.box) || (a.rec.due - b.rec.due));
    return due.concat(fresh, later);
  }

  function recordAnswer(item, ok) {
    const key = item.key;
    let rec = state.srs[key];
    if (!rec) { rec = state.srs[key] = { box: 0, due: 0, seen: 0, right: 0, wrong: 0, last: 0 }; }
    rec.seen += 1;
    rec.last = now();
    if (ok) {
      rec.right += 1;
      rec.box = clamp(rec.box + 1, 0, BOX_MAX);
      rec.due = now() + INTERVALS[rec.box];
    } else {
      rec.wrong += 1;
      rec.box = clamp(rec.box - 1, 0, BOX_MAX);
      rec.due = now() + RETRY_GAP;
    }
    state.seen[item.card.id] = (state.seen[item.card.id] || 0) + 1;
    const d = dailyBucket();
    d.seen += 1;
    if (ok) d.correct += 1; else d.wrong += 1;
    state.log.push({ t: now(), en: item.card.en, cn: item.sense ? item.sense.cn : '', mode: P.mode, ok: !!ok });
    if (state.log.length > 3000) state.log.splice(0, state.log.length - 3000);
  }

  function pruneSrs() {
    const alive = new Set();
    collectItems().forEach((it) => alive.add(it.key));
    Object.keys(state.srs).forEach((k) => { if (!alive.has(k)) delete state.srs[k]; });
    const ids = new Set(state.cards.map((c) => c.id));
    Object.keys(state.seen).forEach((k) => { if (!ids.has(k)) delete state.seen[k]; });
  }

  /* ============ 4. 会话 / 出题 ============ */
  const P = {
    phase: 'setup', mode: 'sense', limit: 20,
    qs: [], cur: 0, answered: 0, correct: 0, wrong: 0,
    streak: 0, best: 0, wrongItems: [], tries: 0, groupIndex: new Map(),
    startedAt: 0, revealed: false
  };

  const MODES = [
    { id: 'sense', icon: '🎭', name: '一词多义', desc: '给一个英文词，选出它的全部意思', tag: '英 → 中' },
    { id: 'synonym', icon: '🔗', name: '同义多词', desc: '给一个中文意思，选出所有对应的英文词', tag: '中 → 英' },
    { id: 'mix', icon: '🎲', name: '混合模式', desc: '两种题随机混着出，一天一轮就够', tag: '推荐' }
  ];

  function buildGroupIndex() {
    const m = new Map();
    buildGroups(state.cards).forEach((g) => m.set(g.key, g.members.map((x) => x.en)));
    return m;
  }

  /** 和这些词「沾亲带故」的所有词（共享过任一释义组），出干扰项时避开 */
  function relatedTo(cards) {
    const set = new Set();
    (cards || []).forEach((c) => { if (c) set.add(c.id); });
    Array.from(set).forEach((id) => {
      const c = state.cards.find((x) => x.id === id);
      if (!c) return;
      c.senses.forEach((s) => {
        (P.groupIndex.get(normCn(s.cn)) || []).forEach((en) => set.add(uid(en)));
      });
    });
    return set;
  }

  function posKey(s) { return String((s && s.pos) || '').replace(/\.$/, '').trim().toLowerCase(); }

  /** 英 → 中：选出这个词的全部意思 */
  function makeSenseQ(item) {
    const card = item.card;
    const seenK = new Set();
    const correct = [];
    const posSet = new Set();
    card.senses.forEach((s) => {
      const k = normCn(s.cn);
      if (!k || seenK.has(k)) return;
      seenK.add(k);
      correct.push({ text: s.cn, ok: true });
      if (posKey(s)) posSet.add(posKey(s));
    });
    const related = relatedTo([card]);
    const same = [];
    const other = [];
    const used = new Set();
    state.cards.forEach((c) => {
      if (related.has(c.id)) return;
      c.senses.forEach((s) => {
        const k = normCn(s.cn);
        if (!k || seenK.has(k) || used.has(k)) return;
        used.add(k);
        const bucket = (posSet.size && posSet.has(posKey(s))) ? same : other;
        bucket.push({ text: s.cn, ok: false });
      });
    });
    shuffle(same); shuffle(other);
    const need = clamp(6 - correct.length, 2, 4);
    const pool = same.concat(other);
    return {
      kind: 'sense', item: item, answer: card.en,
      opts: shuffle(correct.concat(pool.slice(0, need))),
      correctCount: correct.length
    };
  }

  /** 中 → 英：选出所有能表达这个意思的词 */
  function makeSynQ(item) {
    const key = normCn(item.sense.cn);
    const names = (P.groupIndex.get(key) || []).slice();
    if (!names.length) names.push(item.card.en);
    const correct = [];
    const seenId = new Set();
    names.forEach((en) => {
      const id = uid(en);
      if (seenId.has(id)) return;
      seenId.add(id);
      correct.push({ text: en, ok: true, id: id });
    });
    const related = relatedTo(correct.map((x) => state.cards.find((c) => c.id === x.id)));
    const myPos = posKey(item.sense);
    const same = [];
    const other = [];
    state.cards.forEach((c) => {
      if (related.has(c.id) || !c.senses.length) return;
      const hit = (myPos && c.senses.some((s) => posKey(s) === myPos)) ? same : other;
      hit.push({ text: c.en, ok: false });
    });
    shuffle(same); shuffle(other);
    const need = clamp(6 - correct.length, 2, 4);
    const pool = same.concat(other);
    return {
      kind: 'synonym', item: item, cn: item.sense.cn, pos: item.sense.pos || '',
      opts: shuffle(correct.concat(pool.slice(0, need))),
      correctCount: correct.length
    };
  }

  function buildQuestions(mode, limit, preset) {
    const items = collectItems();
    P.groupIndex = buildGroupIndex();
    const cap = limit || 20;

    if (mode === 'mix') {
      const half = Math.ceil(cap / 2);
      const a = buildQuestions('sense', half, preset);
      const b = buildQuestions('synonym', cap - a.length, preset);
      return shuffle(a.concat(b));
    }
    if (mode === 'synonym') {
      let pool = items.filter((it) => normCn(it.sense.cn));
      if (preset && preset.length) pool = preset.filter((it) => normCn(it.sense.cn));
      const sorted = sortForReview(pool);
      const out = [];
      const usedG = new Set();
      for (let i = 0; i < sorted.length && out.length < cap; i++) {
        const k = normCn(sorted[i].sense.cn);
        if (usedG.has(k)) continue;   // 同一个意思只考一次
        usedG.add(k);
        out.push(makeSynQ(sorted[i]));
      }
      return out;
    }
    let pool = items.filter((it) => it.card.senses.length > 0);
    if (preset && preset.length) pool = preset;
    return sortForReview(pool).slice(0, cap).map(makeSenseQ);
  }

  /* ============ 5. 通用 UI 工具 ============ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let toastTimer = null;
  function toast(msg, kind) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2200);
  }

  function speak(text) {
    if (!global.speechSynthesis || !global.SpeechSynthesisUtterance) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-US';
      u.rate = 0.92;
      const vs = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
      const pick = vs.find((v) => /Samantha|Google US|Aria|Jenny|Zira|Natural/i.test(v.name)) || vs[0];
      if (pick) u.voice = pick;
      speechSynthesis.speak(u);
    } catch (e) { /* 不支持就算了 */ }
  }
  function maybeSpeak(text) { if (state.settings.autoSpeak) speak(text); }

  function normEn(s) {
    return String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, ' ')
      .replace(/^to\s+/, '').replace(/[.。,，;；!?]+$/g, '').trim();
  }

  function diffHtml(typed, answer) {
    const a = normEn(answer), t = normEn(typed);
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const ct = t[i], ca = a[i];
      out += (ct === ca) ? esc(ct) : '<span class="wrong-char">' + esc(ct) + '</span>';
    }
    return out || '<span class="wrong-char">（空）</span>';
  }

  function senseTags(senses, hiIdx) {
    if (!senses || !senses.length) return '<span class="sense-tag" style="color:var(--dim)">（还没有释义）</span>';
    return senses.map((s, i) => (
      '<span class="sense-tag"' + (i === hiIdx ? ' style="border-color:rgba(184,240,142,.55);background:rgba(184,240,142,.1)"' : '') + '>' +
      (s.pos ? '<span class="pos">' + esc(s.pos) + '</span>' : '') + esc(s.cn) + '</span>'
    )).join('');
  }

  /* ============ 6. 视图切换 ============ */
  let currentTab = 'practice';

  function switchTab(name) {
    currentTab = name;
    $$('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    $$('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
    if (name === 'import') renderImportMeta();
    if (name === 'library') renderLibrary();
    if (name === 'practice') renderPractice();
    if (name === 'stats') renderStats();
    updateTabBadge();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateTabBadge() {
    const items = collectItems();
    let n = 0;
    items.forEach((it) => {
      if (!it.rec || !it.rec.seen || (it.rec.due <= now() && it.rec.box < BOX_MAX)) n++;
    });
    const tab = $('.tab[data-tab="practice"]');
    if (!tab) return;
    const old = tab.querySelector('.dot');
    if (old) old.remove();
    if (n > 0 && state.cards.length) {
      const d = document.createElement('span');
      d.className = 'dot';
      d.textContent = n > 99 ? '99+' : n;
      tab.appendChild(d);
    }
  }

  /* ============ 7. 导入视图 ============ */
  let draft = [];
  let lastParse = null;

  const SAMPLE = [
    '# 一堆乱七八糟的单词，直接粘进来就行',
    'abandon v. 放弃；遗弃；抛弃 /əˈbændən/',
    'desert  n. 沙漠   v. 抛弃，遗弃',
    '放弃 = abandon, desert, give up',
    'give up  放弃',
    'abandon     n. 放任，放纵',
    'reluctant adj. 不情愿的，勉强的  例: He was reluctant to go. - 他不愿意去。',
    'compromise',
    '妥协；折中',
    'compromise n. 妥协  v. 妥协；危及',
    'ambiguous adj. 模棱两可的，含糊不清的',
    'vague adj. 模糊的，含糊的',
    '含糊的: vague, ambiguous',
    '| fragile | adj. | 脆弱的，易碎的 |',
    '1. persist v. 坚持；持续',
    '2. 坚持 = persist, stick to, insist',
    'abandon/desert v. 抛弃'
  ].join('\n');

  function renderImportMeta() {
    const hint = $('#parse-hint');
    if (!hint) return;
    const items = collectItems();
    hint.innerHTML = state.cards.length
      ? '词库现有 <b>' + state.cards.length + '</b> 词 / <b>' + items.length + '</b> 条释义'
      : '词库还是空的，先粘一段试试';
  }

  const FORMAT_LABEL = { json: 'JSON', table: '表格行', loose: '原始文本', empty: '空' };

  function doParse() {
    const raw = $('#raw-input').value;
    if (!raw.trim()) { toast('先粘点单词进来', 'err'); return; }
    const res = parseAny(raw);
    if (!res.cards.length) { toast('没认出单词来，检查一下格式', 'err'); return; }
    draft = res.cards;
    lastParse = res;
    const panel = $('#preview-panel');
    panel.hidden = false;
    const pf = $('#preview-format');
    if (pf) pf.textContent = '识别为 ' + (FORMAT_LABEL[res.format] || '自动');
    renderDraft();
    const words = draft.length;
    const senses = draft.reduce((n, c) => n + c.senses.length, 0);
    toast('整理完成：' + words + ' 词 / ' + senses + ' 条释义 · ' + (FORMAT_LABEL[res.format] || ''), 'ok');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function sensesToText(senses) {
    return (senses || []).map((s) => (s.pos ? s.pos + ' ' : '') + s.cn).join('\n');
  }
  function textToSenses(text) {
    return String(text || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
      const m = l.match(/^([a-z]+\.)\s*(.+)$/i);
      return m ? { pos: m[1].toLowerCase(), cn: m[2].trim() } : { pos: '', cn: l };
    }).filter((s) => s.cn);
  }

  function renderDraft() {
    const box = $('#draft-list');
    if (!box) return;
    box.innerHTML = draft.map((c, i) => {
      const bad = !c.senses.length ? ' bad-row' : '';
      const ex = c.examples && c.examples[0] ? c.examples[0] : null;
      const rows = Math.max(2, c.senses.length);
      return '<div class="draft-row' + bad + '" data-i="' + i + '">' +
        '<div class="dr-main">' +
        '<input type="text" class="in-en" data-f="en" value="' + esc(c.en) + '" placeholder="单词">' +
        '<input type="text" class="in-ph" data-f="phonetic" value="' + esc(c.phonetic) + '" placeholder="音标（可选）">' +
        '</div>' +
        '<textarea class="in-sense" data-f="senses" rows="' + rows + '" placeholder="每行一个释义，可带 v. n.">' + esc(sensesToText(c.senses)) + '</textarea>' +
        '<button class="icon-btn del" data-f="del" title="删除">✕</button>' +
        '<input type="text" class="in-ex" data-f="example" value="' + esc(ex ? ex.en + (ex.cn ? ' - ' + ex.cn : '') : '') + '" placeholder="例句（可选）">' +
        (c.note ? '<div class="dr-note">📎 ' + esc(c.note) + '</div>' : '') +
        '</div>';
    }).join('');
    updatePreviewSummary();
  }

  function updatePreviewSummary() {
    const senses = draft.reduce((n, c) => n + c.senses.length, 0);
    const pc = $('#preview-count');
    if (pc) pc.textContent = draft.length + ' 词 / ' + senses + ' 释义';
    const groups = buildGroups(draft);
    const gp = $('#group-preview');
    if (gp) {
      gp.innerHTML = groups.length
        ? groups.slice(0, 14).map((g) => '<span class="group-chip"><b>' + esc(g.cn) + '</b> ← ' + esc(g.members.map((m) => m.en).join(' / ')) + '</span>').join('')
        : '<span class="group-chip">暂未发现同义组（多个单词共享同一个中文释义时会自动成组）</span>';
    }
    const il = $('#issue-list');
    if (il) {
      const issues = (lastParse && lastParse.issues) ? lastParse.issues : [];
      il.innerHTML = issues.slice(0, 8).map((it) =>
        '<div class="issue">' + (it.line ? '第 ' + it.line + ' 行：' : '') + esc(it.why) + ' — <b>' + esc(it.text.slice(0, 46)) + '</b></div>'
      ).join('');
    }
  }

  function bindImport() {
    const raw = $('#raw-input');
    $('#btn-sample').onclick = () => { raw.value = SAMPLE; raw.focus(); toast('示例已填入，点「整理一下」'); };
    $('#btn-clear-input').onclick = () => { raw.value = ''; raw.focus(); };
    $('#btn-parse').onclick = doParse;
    $('#btn-file').onclick = () => $('#file-import').click();
    $('#file-import').onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { raw.value = String(rd.result || ''); doParse(); };
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
    };
    raw.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doParse(); }
    });

    const dl = $('#draft-list');
    dl.addEventListener('input', (e) => {
      const row = e.target.closest('.draft-row');
      if (!row) return;
      const i = +row.dataset.i;
      const f = e.target.dataset.f;
      const card = draft[i];
      if (!card) return;
      if (f === 'en') { card.en = e.target.value; card.id = uid(card.en); }
      else if (f === 'phonetic') card.phonetic = e.target.value;
      else if (f === 'senses') card.senses = textToSenses(e.target.value);
      else if (f === 'example') {
        card.examples = e.target.value.trim() ? [parseExample(e.target.value)] : [];
      }
    });
    dl.addEventListener('change', (e) => {
      const row = e.target.closest('.draft-row');
      if (row && e.target.dataset.f === 'senses') {
        row.classList.toggle('bad-row', !draft[+row.dataset.i].senses.length);
        updatePreviewSummary();
      }
    });
    dl.addEventListener('click', (e) => {
      const del = e.target.closest('[data-f="del"]');
      if (del) {
        const row = del.closest('.draft-row');
        draft.splice(+row.dataset.i, 1);
        renderDraft();
      }
    });

    $('#btn-sort-draft').onclick = () => {
      draft.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));
      renderDraft();
    };
    $('#btn-drop-empty').onclick = () => {
      const before = draft.length;
      draft = draft.filter((c) => c.senses.length);
      renderDraft();
      toast('删掉 ' + (before - draft.length) + ' 个没释义的条目');
    };
    $('#btn-discard').onclick = () => { draft = []; lastParse = null; $('#preview-panel').hidden = true; };
    $('#btn-import').onclick = importDraft;
  }

  function importDraft() {
    if (!draft.length) { toast('没有可导入的内容', 'err'); return; }
    let words = 0, senses = 0;
    draft.forEach((c) => {
      if (!c.en.trim()) return;
      const before = state.cards.length;
      const card = upsertCard(state.cards, c.en.trim(), c.senses, { phonetic: c.phonetic, note: c.note });
      if (!card) return;
      if (state.cards.length > before) words++;
      senses += c.senses.length;
      if (c.examples && c.examples.length) {
        c.examples.forEach((ex) => {
          if (ex.en && card.examples.length < 8 && !card.examples.some((x) => x.en === ex.en)) card.examples.push(ex);
        });
      }
    });
    const d = dailyBucket();
    d.words += words;
    pruneSrs();
    saveState();
    draft = [];
    lastParse = null;
    $('#preview-panel').hidden = true;
    $('#raw-input').value = '';
    toast('已导入 ' + words + ' 个新词，共 ' + senses + ' 条释义', 'ok');
    renderImportMeta();
    updateTabBadge();
    switchTab('library');
  }

  /* ============ 8. 词库视图 ============ */
  let libEditing = new Set();

  function cardStats(card) {
    let right = 0, wrong = 0, mastered = 0, due = 0, seen = 0;
    (card.senses || []).forEach((s) => {
      const rec = state.srs[itemKey(card, s)];
      if (!rec) return;
      right += rec.right || 0;
      wrong += rec.wrong || 0;
      seen += rec.seen || 0;
      if (rec.box >= 4) mastered++;
      if (rec.due <= now() && rec.box < BOX_MAX) due++;
    });
    return { right: right, wrong: wrong, mastered: mastered, due: due, seen: seen, total: (card.senses || []).length };
  }

  function cardStatus(card) {
    const st = cardStats(card);
    if (!st.total) return { label: '缺释义', cls: 'bad' };
    if (st.mastered >= st.total) return { label: '已掌握', cls: 'accent' };
    if (st.wrong > 0 && st.wrong >= st.right) return { label: '薄弱', cls: 'warn' };
    if (st.seen === 0) return { label: '新词', cls: '' };
    return { label: '在练 ' + st.mastered + '/' + st.total, cls: '' };
  }

  function renderLibrary() {
    const q = ($('#lib-search').value || '').toLowerCase().trim();
    const filter = $('#lib-filter').value;
    const sort = $('#lib-sort').value;

    let list = state.cards.slice();
    if (q) {
      list = list.filter((c) =>
        c.en.toLowerCase().includes(q) ||
        (c.senses || []).some((s) => s.cn.toLowerCase().includes(q)) ||
        (c.examples || []).some((e) => e.en.toLowerCase().includes(q))
      );
    }
    if (filter === 'new') list = list.filter((c) => cardStats(c).seen === 0);
    else if (filter === 'weak') { list = list.filter((c) => { const st = cardStats(c); return st.wrong > 0 && st.right <= st.wrong; }); }
    else if (filter === 'mastered') list = list.filter((c) => { const st = cardStats(c); return st.total > 0 && st.mastered >= st.total; });
    else if (filter === 'nosure') list = list.filter((c) => !c.senses.length);

    if (sort === 'alpha') list.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));
    else if (sort === 'bad') list.sort((a, b) => cardStats(b).wrong - cardStats(a).wrong);
    else if (sort === 'due') list.sort((a, b) => cardStats(b).due - cardStats(a).due);

    const groups = buildGroups(state.cards);
    const gmap = new Map();
    groups.forEach((g) => g.members.forEach((m) => {
      if (!gmap.has(m.id)) gmap.set(m.id, []);
      gmap.get(m.id).push(g);
    }));

    $('#lib-count').textContent = '显示 ' + list.length + ' / ' + state.cards.length + ' 词';

    const wrap = $('#lib-list');
    if (!list.length) {
      wrap.innerHTML = '<div class="panel"><div class="empty"><div class="big">📭</div>' +
        (state.cards.length ? '这个筛选下没有单词' : '词库还是空的，去「导入」粘一批进来吧') + '</div></div>';
      return;
    }

    wrap.innerHTML = list.map((c) => {
      const st = cardStats(c);
      const status = cardStatus(c);
      const editing = libEditing.has(c.id);
      const gs = (gmap.get(c.id) || []).slice(0, 3);
      const seen = state.seen[c.id] || 0;
      return '<div class="lib-item" data-id="' + esc(c.id) + '">' +
        '<div class="lib-head">' +
        '<span class="lib-word">' + esc(c.en) + '</span>' +
        (c.phonetic ? '<span class="lib-phon">/' + esc(c.phonetic.replace(/^\/|\/$/g, '')) + '/</span>' : '') +
        '<button class="speak" data-act="say" title="发音">🔊</button>' +
        '<span class="badge ' + status.cls + '">' + esc(status.label) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="icon-btn" data-act="edit" title="编辑">✎</button>' +
        '</div>' +
        '<div class="lib-senses">' + senseTags(c.senses, -1) + '</div>' +
        (c.examples && c.examples[0] ? '<div class="sub" style="margin-top:8px">例：<i style="font-family:var(--serif)">' + esc(c.examples[0].en) + '</i>' + (c.examples[0].cn ? ' — ' + esc(c.examples[0].cn) : '') + '</div>' : '') +
        (c.note ? '<div class="sub" style="margin-top:6px;color:#9fb0c0">📎 ' + esc(c.note) + '</div>' : '') +
        '<div class="lib-meta">' +
        '<span>见过的次数 ' + seen + '</span>' +
        '<span>对 ' + st.right + ' · 错 ' + st.wrong + '</span>' +
        (st.due ? '<span style="color:var(--warn)">待复习 ' + st.due + '</span>' : '') +
        (gs.length ? gs.map((g) => '<span>同义「' + esc(g.cn) + '」：' + esc(g.members.filter((m) => m.id !== c.id).map((m) => m.en).join(', ')) + '</span>').join('') : '') +
        '</div>' +
        (editing ? editForm(c) : '') +
        '</div>';
    }).join('');
  }

  function finalizeCardEdit(card) {
    const newId = uid(card.en);
    if (!newId) return;
    if (newId !== card.id) {
      const dup = state.cards.find((c) => c !== card && c.id === newId);
      if (dup) {
        (card.senses || []).forEach((s) => {
          if (!dup.senses.some((x) => normCn(x.cn) === normCn(s.cn))) dup.senses.push(s);
        });
        (card.examples || []).forEach((ex) => {
          if (!dup.examples.some((x) => x.en === ex.en)) dup.examples.push(ex);
        });
        state.cards = state.cards.filter((c) => c !== card);
        libEditing.delete(card.id);
      } else {
        libEditing.delete(card.id);
        card.id = newId;
        libEditing.add(newId);
      }
    }
    pruneSrs();
    saveState();
  }

  function editForm(c) {
    return '<div class="lib-edit">' +
      '<div class="row gap">' +
      '<input data-f="en" value="' + esc(c.en) + '" placeholder="单词" style="flex:1">' +
      '<input data-f="phonetic" value="' + esc(c.phonetic) + '" placeholder="音标" style="max-width:170px">' +
      '</div>' +
      '<textarea data-f="senses" rows="' + Math.max(3, c.senses.length) + '" placeholder="每行一个释义">' + esc(sensesToText(c.senses)) + '</textarea>' +
      '<input data-f="example" value="' + esc(c.examples && c.examples[0] ? c.examples[0].en + (c.examples[0].cn ? ' - ' + c.examples[0].cn : '') : '') + '" placeholder="例句（可选）">' +
      '<div class="row gap"><button class="btn sm primary" data-act="edit-done">完成</button>' +
      '<button class="btn sm danger-ghost" data-act="del">删除这个词</button></div>' +
      '</div>';
  }

  function bindLibrary() {
    ['#lib-search', '#lib-filter', '#lib-sort'].forEach((sel) => {
      const el = $(sel);
      el.addEventListener('input', renderLibrary);
      el.addEventListener('change', renderLibrary);
    });

    const wrap = $('#lib-list');
    wrap.addEventListener('input', (e) => {
      const item = e.target.closest('.lib-item');
      if (!item || !e.target.dataset.f) return;
      const card = state.cards.find((c) => c.id === item.dataset.id);
      if (!card) return;
      const f = e.target.dataset.f;
      if (f === 'en') card.en = e.target.value;
      else if (f === 'phonetic') card.phonetic = e.target.value;
      else if (f === 'senses') card.senses = textToSenses(e.target.value);
      else if (f === 'example') card.examples = e.target.value.trim() ? [parseExample(e.target.value)] : [];
    });
    wrap.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      const item = act.closest('.lib-item');
      if (!item) return;
      const id = item.dataset.id;
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      const a = act.dataset.act;
      if (a === 'say') { speak(card.en); return; }
      if (a === 'edit') {
        if (libEditing.has(id)) libEditing.delete(id); else libEditing.add(id);
        renderLibrary();
        return;
      }
      if (a === 'edit-done') {
        finalizeCardEdit(card);
        renderLibrary();
        updateTabBadge();
        toast('已保存');
        return;
      }
      if (a === 'del') {
        if (!confirm('删除「' + card.en + '」？')) return;
        state.cards = state.cards.filter((c) => c.id !== id);
        libEditing.delete(id);
        pruneSrs();
        saveState();
        renderLibrary();
        updateTabBadge();
        toast('已删除');
      }
    });

    $('#btn-export').onclick = exportJSON;
    $('#btn-import-json').onclick = () => $('#file-json').click();
    $('#file-json').onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          const cards = Array.isArray(data.cards) ? data.cards : [];
          if (!cards.length) throw new Error('没有 cards');
          cards.forEach((c) => {
            if (!c.en) return;
            upsertCard(state.cards, c.en, c.senses || [], { phonetic: c.phonetic });
          });
          if (data.srs) Object.assign(state.srs, data.srs);
          pruneSrs();
          saveState();
          renderLibrary();
          toast('导入成功，现在共 ' + state.cards.length + ' 词', 'ok');
        } catch (err) { toast('文件解析失败：' + err.message, 'err'); }
      };
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
    };
  }

  function exportJSON() {
    const payload = { app: 'wordforge', version: 1, exportedAt: new Date().toISOString(), cards: state.cards, srs: state.srs, seen: state.seen, daily: state.daily };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '词锻-词库-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已导出 JSON', 'ok');
  }

  /* ============ 9. 练习视图 ============ */
  function setupHtml() {
    const items = collectItems();
    const fresh = items.filter((it) => isNew(it.rec)).length;
    const due = items.filter((it) => it.rec && it.rec.seen && it.rec.due <= now() && it.rec.box < BOX_MAX).length;
    const mastered = items.filter((it) => it.rec && it.rec.box >= 4).length;
    const groups = buildGroups(state.cards);
    const available = {
      sense: items.filter((it) => it.card.senses.length > 0).length,
      synonym: new Set(items.map((it) => normCn(it.sense.cn)).filter(Boolean)).size,
      mix: items.filter((it) => it.card.senses.length > 0).length
    };
    const today = state.daily[todayKey()] || { seen: 0 };
    const mode = P.mode;
    P.limit = clamp(P.limit || state.settings.limit || 20, 5, 200);

    if (!state.cards.length) {
      return '<div class="panel"><div class="empty"><div class="big">🪶</div>' +
        '<p style="margin-bottom:14px">词库是空的。先去「导入」把单词粘进来，我帮你整理。</p>' +
        '<button class="btn primary" data-go="import">去导入单词</button></div></div>';
    }

    const modeCards = MODES.map((m) => {
      const n = available[m.id] || 0;
      const dis = n ? '' : ' disabled';
      const sel = m.id === mode ? ' sel' : '';
      return '<button class="mode-card' + sel + dis + '" data-mode="' + m.id + '">' +
        '<span class="mi">' + m.icon + '</span>' +
        '<span class="mt">' + m.name + '<span class="mtag">' + m.tag + '</span></span>' +
        '<span class="md">' + m.desc + '</span>' +
        '<span class="md" style="color:var(--dim);margin-top:4px">' + (n ? '可练 ' + n + ' 项' : '暂无可练内容') + '</span>' +
        '</button>';
    }).join('');

    const tip = mode === 'synonym'
      ? (groups.length ? '当前有 ' + groups.length + ' 组同义。给一个中文意思，从选项里挑出所有能表达它的英文词。' : '还没有同义组，题库会自动出「单词↔释义」的对应题。')
      : mode === 'sense'
        ? '每题会混入别的词的释义当干扰项，必须选全、不能多选。'
        : '两种题随机混着来：英 → 中 认词义，中 → 英 认同义词。';

    return '<div class="panel">' +
      '<div class="hero-row">' +
      '<div class="stat"><b>' + state.cards.length + '</b><span>单词</span></div>' +
      '<div class="stat"><b>' + items.length + '</b><span>释义</span></div>' +
      '<div class="stat ' + ((due + fresh) > 0 ? 'warn' : '') + '"><b>' + (due + fresh) + '</b><span>待办</span><span class="s2">复习 ' + due + ' · 新 ' + fresh + '</span></div>' +
      '<div class="stat hi"><b>' + mastered + '</b><span>已掌握释义</span></div>' +
      '</div>' +
      '<div class="sub" style="margin-top:10px">今天已经练了 ' + today.seen + ' 次 · 词库共 ' + buildGroups(state.cards).length + ' 组同义</div>' +
      '</div>' +
      '<div class="mode-grid">' + modeCards + '</div>' +
      '<div class="panel">' +
      '<div class="start-bar">' +
      '<div class="seg" id="limit-seg"><span class="seg-label">本轮</span>' +
      [10, 20, 30, 50].map((n) => '<button class="seg-btn' + (n === P.limit ? ' on' : '') + '" data-n="' + n + '">' + n + '</button>').join('') +
      '</div>' +
      '<label class="check"><input type="checkbox" id="auto-speak"' + (state.settings.autoSpeak ? ' checked' : '') + '> 自动发音</label>' +
      '<span class="spacer"></span>' +
      '<button class="btn primary lg" id="btn-start">开始 · ' + (MODES.find((m) => m.id === mode) || MODES[0]).name + '</button>' +
      '</div>' +
      '<div class="sub" style="margin-top:10px">' + tip + '</div>' +
      '</div>';
  }

  function runShellHtml() {
    return '<div class="panel">' +
      '<div class="run-head">' +
      '<button class="icon-btn" id="btn-quit" title="退出本轮">✕</button>' +
      '<div class="progress"><div class="bar" id="run-bar"></div></div>' +
      '<span class="counter" id="run-counter"></span>' +
      '</div>' +
      '<div class="stage" id="stage"></div>' +
      '</div>';
  }

  function renderPractice() {
    const body = $('#practice-body');
    if (!body) return;
    if (P.phase === 'setup') body.innerHTML = setupHtml();
    else if (P.phase === 'run') { body.innerHTML = runShellHtml(); renderStage(); }
    else body.innerHTML = summaryHtml();
    bindPractice();
  }

  function bindPractice() {
    const body = $('#practice-body');
    body.onclick = (e) => {
      const go = e.target.closest('[data-go]');
      if (go) { switchTab(go.dataset.go); return; }
      const sb = e.target.closest('.seg-btn');
      if (sb) {
        P.limit = +sb.dataset.n;
        state.settings.limit = P.limit;
        saveState();
        $$('.seg-btn').forEach((b) => b.classList.toggle('on', b === sb));
        return;
      }
      const mc = e.target.closest('.mode-card');
      if (mc && mc.dataset.mode) {
        P.mode = mc.dataset.mode;
        state.settings.mode = P.mode;
        saveState();
        renderPractice();
        return;
      }
      if (e.target.closest('#btn-start')) { startSession(P.mode); return; }
      if (e.target.closest('#btn-quit')) { P.phase = 'setup'; renderPractice(); return; }
      if (e.target.closest('#btn-again')) { startSession(P.mode); return; }
      if (e.target.closest('#btn-home')) { P.phase = 'setup'; renderPractice(); return; }
      if (e.target.closest('#btn-retry-wrong')) { retryWrong(); return; }
    };
    body.onchange = (e) => {
      if (e.target.id === 'auto-speak') { state.settings.autoSpeak = e.target.checked; saveState(); }
    };
  }

  function startSession(mode, presetItems) {
    const qs = buildQuestions(mode, P.limit, presetItems);
    if (!qs.length) { toast('这个模式暂时没有可练的内容', 'err'); return; }
    P.phase = 'run';
    P.mode = mode;
    state.settings.mode = mode;
    P.qs = qs;
    P.cur = 0;
    P.answered = 0;
    P.correct = 0;
    P.wrong = 0;
    P.streak = 0;
    P.tries = 0;
    P.wrongItems = [];
    P.startedAt = now();
    P.revealed = false;
    saveState();
    renderPractice();
  }

  function currentQ() { return P.qs[P.cur] || null; }

  function updateProgress() {
    const total = Math.max(P.qs.length, 1);
    const bar = $('#run-bar');
    if (bar) bar.style.width = Math.round((P.answered / total) * 100) + '%';
    const counter = $('#run-counter');
    if (counter) counter.textContent = Math.min(P.cur + 1, total) + ' / ' + total;
  }

  function renderStage() {
    const stage = $('#stage');
    if (!stage) return;
    const q = currentQ();
    if (!q) { finishSession(); return; }
    P.tries = 0;
    P.revealed = false;
    updateProgress();

    stage.innerHTML = optionsHtml(q);
    bindStage(q);

    if (q.kind === 'sense' && state.settings.autoSpeak) {
      setTimeout(() => speak(q.answer), 150);
    }
  }

  function advance() {
    if (now() < (P.nextReadyAt || 0)) return;
    P.cur += 1;
    if (P.cur >= P.qs.length) { finishSession(); return; }
    renderStage();
  }

  function finishSession() {
    P.phase = 'done';
    renderPractice();
    updateTabBadge();
    saveState();
  }

  function summaryHtml() {
    const total = P.correct + P.wrong;
    const acc = total ? Math.round((P.correct / total) * 100) : 0;
    const mins = Math.max(1, Math.round((now() - P.startedAt) / 60000));
    const uniq = [];
    const seen = new Set();
    P.wrongItems.forEach((it) => { if (!seen.has(it.key)) { seen.add(it.key); uniq.push(it); } });
    return '<div class="panel">' +
      '<div class="panel-head"><h2>这一轮结束了</h2><p>' + (MODES.find((m) => m.id === P.mode) || {}).name + ' · 用时约 ' + mins + ' 分钟</p></div>' +
      '<div class="sum-grid">' +
      '<div class="stat"><b>' + total + '</b><span>答题数</span></div>' +
      '<div class="stat hi"><b>' + P.correct + '</b><span>答对</span></div>' +
      '<div class="stat ' + (P.wrong ? 'warn' : '') + '"><b>' + P.wrong + '</b><span>答错</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>正确率</span></div>' +
      '</div>' +
      (uniq.length
        ? '<div class="hr"></div><div class="sub">这轮错的 ' + uniq.length + ' 个：</div><div class="wrong-list">' +
        uniq.map((it) => '<span class="chip" data-say="' + esc(it.card.en) + '">' + esc(it.card.en) + (it.sense ? ' · ' + esc(it.sense.cn) : '') + '</span>').join('') +
        '</div>'
        : '<div class="sub" style="margin-top:8px;color:var(--good)">一个都没错，很强。</div>') +
      '<div class="row gap" style="margin-top:20px">' +
      '<button class="btn primary" id="btn-again">再来一轮</button>' +
      (uniq.length ? '<button class="btn" id="btn-retry-wrong">只练错的（' + uniq.length + '）</button>' : '') +
      '<span class="spacer"></span>' +
      '<button class="btn ghost" id="btn-home">回到设置</button>' +
      '</div></div>';
  }

  function retryWrong() {
    const items = [];
    const seen = new Set();
    P.wrongItems.forEach((it) => { if (!seen.has(it.key)) { seen.add(it.key); items.push(it); } });
    if (!items.length) { toast('没有错题'); return; }
    P.limit = Math.max(items.length, 5);
    startSession(P.mode, items);
  }

  /* ---------- 各题型渲染 ---------- */
  /* ---------- 题型渲染：全部是多选，不用打字 ---------- */
  function optionsHtml(q) {
    const isSyn = q.kind === 'synonym';
    let head;
    if (isSyn) {
      head = '<div class="q-kind">中 → 英 · 选出所有意思对得上的词</div>' +
        '<div class="cn-prompt">' + (q.pos ? '<span class="pos">' + esc(q.pos) + '</span>' : '') + esc(q.cn) + '</div>' +
        '<div class="sub q-count">共 <b style="color:var(--accent)">' + q.correctCount + '</b> 个词能表达这个意思</div>';
    } else {
      head = '<div class="q-kind">英 → 中 · 选出这个词的全部意思</div>' +
        '<div class="word-lg sm">' + esc(q.answer) + '</div>' +
        '<div class="phon-line">' +
        '<span>' + esc(q.item.card.phonetic ? '/' + q.item.card.phonetic.replace(/^\/|\/$/g, '') + '/' : '') + '</span>' +
        '<button class="speak" data-say="' + esc(q.answer) + '">🔊</button></div>' +
        '<div class="sub q-count">共 <b style="color:var(--accent)">' + q.correctCount + '</b> 个意思</div>';
    }
    return head +
      '<div class="options' + (isSyn ? ' en' : '') + '" id="opts">' +
      q.opts.map((o, i) => '<button class="option" data-i="' + i + '"><span class="mark">✓</span><span>' + esc(o.text) + '</span></button>').join('') +
      '</div>' +
      '<div class="actions" id="actions">' +
      '<button class="btn primary" id="btn-check">提交 <span class="kb">Enter</span></button>' +
      '<span class="spacer"></span><span class="sub" id="sel-count">已选 0 项</span>' +
      '</div>';
  }

  function bindStage(q) {
    const opts = $('#opts');
    q.picked = new Set();
    if (!opts) return;
    opts.addEventListener('click', (e) => {
      const b = e.target.closest('.option');
      if (!b || P.revealed) return;
      const i = +b.dataset.i;
      if (q.picked.has(i)) q.picked.delete(i); else q.picked.add(i);
      b.classList.toggle('picked', q.picked.has(i));
      const sc = $('#sel-count');
      if (sc) sc.textContent = '已选 ' + q.picked.size + ' 项';
    });
    $('#btn-check').onclick = () => checkOptions(q);
  }

  /* ---------- 判题 ---------- */
  function checkOptions(q, forced) {
    if (P.revealed) return;
    const picked = q.picked || new Set();
    let ok = true;
    q.opts.forEach((o, i) => { if (!!o.ok !== picked.has(i)) ok = false; });
    P.revealed = true;
    recordAnswer(q.item, ok);
    P.answered += 1;
    if (ok) {
      P.correct += 1; P.streak += 1; P.best = Math.max(P.best, P.streak);
    } else {
      P.wrong += 1; P.streak = 0; P.wrongItems.push(q.item);
      if (!q.retry) P.qs.push(Object.assign({}, q, { retry: true, picked: null, opts: q.opts.map((o) => Object.assign({}, o)) }));
    }
    updateProgress();
    saveState();

    const opts = $('#opts');
    if (opts) {
      Array.from(opts.children).forEach((el, i) => {
        const o = q.opts[i];
        const mark = el.querySelector('.mark');
        el.classList.remove('picked');
        if (o.ok && picked.has(i)) { el.classList.add('ok'); if (mark) mark.textContent = '✓'; }
        else if (o.ok && !picked.has(i)) { el.classList.add('missed'); if (mark) mark.textContent = '漏'; }
        else if (!o.ok && picked.has(i)) { el.classList.add('bad'); if (mark) mark.textContent = '✗'; }
        else if (mark) mark.textContent = '';
      });
    }
    const isSyn = q.kind === 'synonym';
    let missed = 0;
    let extra = 0;
    q.opts.forEach((o, i) => {
      if (o.ok && !picked.has(i)) missed += 1;
      if (!o.ok && picked.has(i)) extra += 1;
    });

    // 结果就地显示在原来的「已选 N 项」位置，页面高度不变
    const sc = $('#sel-count');
    if (sc) {
      sc.className = 'vline ' + (ok ? 'good' : 'bad');
      sc.textContent = ok
        ? '✓ 全对' + (P.streak > 1 ? ' · 连击 ×' + P.streak : '')
        : '✗ ' + [missed ? '漏 ' + missed : '', extra ? '多选 ' + extra : ''].filter(Boolean).join(' · ');
    }

    // 提交按钮直接变成「下一个」
    const btn = $('#btn-check');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '下一个 <span class="kb">Enter</span>';
      btn.onclick = () => advance();
    }
    // 笔记放在按钮「下面」，不占按钮位置，也不会把它挤走
    const card = q.item.card;
    const extras = [];
    if (card.note) extras.push('📎 ' + esc(card.note));
    const actions = $('#actions');
    if (extras.length && actions) {
      const box = document.createElement('div');
      box.className = 'answer-extra';
      box.innerHTML = extras.map((x) => '<div>' + x + '</div>').join('');
      actions.insertAdjacentElement('afterend', box);
    }
    P.nextReadyAt = now() + 260;
    if (!isSyn) speak(q.answer);
  }

  /* ---------- 键盘 ---------- */
  function onKeydown(e) {
    if (P.phase !== 'run') return;
    if (e.defaultPrevented) return;
    if (e.key === 'Enter' && !e.isComposing) {
      const ck = document.querySelector('#btn-check');
      if (ck && !ck.disabled) { e.preventDefault(); ck.click(); }
      return;
    }
    if (e.key === 'Escape') { P.phase = 'setup'; renderPractice(); }
  }

  /* ============ 10. 统计视图 ============ */
  function renderStats() {
    const items = collectItems();
    const total = state.cards.length;
    const senses = items.length;
    const mastered = items.filter((it) => it.rec && it.rec.box >= 4).length;
    const due = items.filter((it) => it.rec && it.rec.seen && it.rec.due <= now() && it.rec.box < BOX_MAX).length;
    const today = state.daily[todayKey()] || { seen: 0, correct: 0, wrong: 0, words: 0 };
    const accToday = (today.correct + today.wrong) ? Math.round((today.correct * 100) / (today.correct + today.wrong)) : 0;

    // 7 天
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const t = now() - i * DAY;
      const k = todayKey(t);
      const b = state.daily[k] || { seen: 0 };
      days.push({ k: k, label: k.slice(5), n: b.seen || 0 });
    }
    const maxN = Math.max(1, ...days.map((d) => d.n));

    // 错词榜
    const wrongCount = new Map();
    state.log.forEach((l) => {
      if (l.ok || !l.en) return;
      wrongCount.set(l.en, (wrongCount.get(l.en) || 0) + 1);
    });
    const topWrong = Array.from(wrongCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);

    // 总正确率
    let tr = 0, tw = 0;
    Object.values(state.srs).forEach((r) => { tr += r.right || 0; tw += r.wrong || 0; });
    const accAll = (tr + tw) ? Math.round((tr * 100) / (tr + tw)) : 0;

    $('#stats-body').innerHTML =
      '<div class="panel">' +
      '<div class="hero-row">' +
      '<div class="stat"><b>' + total + '</b><span>单词</span></div>' +
      '<div class="stat"><b>' + senses + '</b><span>释义</span></div>' +
      '<div class="stat hi"><b>' + (senses ? Math.round((mastered * 100) / senses) : 0) + '%</b><span>掌握度</span></div>' +
      '<div class="stat ' + (due ? 'warn' : '') + '"><b>' + due + '</b><span>待复习</span></div>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="row gap" style="font-size:13px;color:var(--muted)">' +
      '<span>今天练了 <b style="color:var(--text)">' + (today.seen || 0) + '</b> 次</span>' +
      '<span>今天正确率 <b style="color:var(--text)">' + accToday + '%</b></span>' +
      '<span>累计正确率 <b style="color:var(--text)">' + accAll + '%</b></span>' +
      '<span>累计答对 <b style="color:var(--good)">' + tr + '</b> / 答错 <b style="color:var(--bad)">' + tw + '</b></span>' +
      '</div>' +
      '</div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>最近 7 天</h2></div>' +
      '<div class="bars">' +
      days.map((d) => '<div class="bar-col"><span class="n">' + d.n + '</span>' +
        '<div class="b' + (d.n ? '' : ' zero') + '" style="height:' + Math.round((d.n / maxN) * 76) + '%"></div>' +
        '<span class="d">' + d.label + '</span></div>').join('') +
      '</div></div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>错得最多的词</h2><p>这些建议用「拼写输出」多打几遍</p></div>' +
      (topWrong.length
        ? '<div class="top-wrong">' + topWrong.map(([en, n]) => {
          const c = state.cards.find((x) => x.en === en);
          return '<div class="tw-row"><button class="speak" data-say="' + esc(en) + '">🔊</button>' +
            '<span class="w">' + esc(en) + '</span>' +
            '<span class="cn">' + esc(c && c.senses[0] ? c.senses[0].cn : '') + '</span>' +
            '<span class="n">错 ' + n + ' 次</span></div>';
        }).join('') + '</div>'
        : '<div class="empty" style="padding:20px">还没有错词记录</div>') +
      '</div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>数据</h2><p>数据只存在这台电脑的浏览器里，换设备请导出 JSON。</p></div>' +
      '<div class="row gap">' +
      '<button class="btn" id="btn-export2">导出全部数据</button>' +
      '<button class="btn ghost" id="btn-reset-progress">重置学习进度（保留单词）</button>' +
      '<button class="btn danger-ghost" id="btn-wipe">清空词库</button>' +
      '</div></div>';

    $('#btn-export2').onclick = exportJSON;
    $('#btn-reset-progress').onclick = () => {
      if (!confirm('清空所有学习记录（见过的次数、对错、复习计划），单词保留？')) return;
      state.srs = {}; state.seen = {}; state.log = []; state.daily = {};
      saveState(); renderStats(); updateTabBadge(); toast('学习进度已重置');
    };
    $('#btn-wipe').onclick = () => {
      if (!confirm('清空整个词库？这个不能撤销。')) return;
      state = emptyState();
      state.wiped = true;
      saveState(); renderStats(); updateTabBadge(); switchTab('import');
      toast('已清空');
    };
  }

  /* ============ 11. 启动 ============ */
  function boot() {
    state = loadState();
    if (state._justSeeded) { delete state._justSeeded; saveState(); }
    P.mode = MODES.some((m) => m.id === state.settings.mode) ? state.settings.mode : 'sense';
    P.limit = state.settings.limit || 20;

    $$('.tab').forEach((t) => { t.onclick = () => switchTab(t.dataset.tab); });
    bindImport();
    bindLibrary();
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]');
      if (b) { e.preventDefault(); speak(b.dataset.say); }
    });

    renderImportMeta();
    switchTab(state.cards.length ? 'practice' : 'import');
  }

  /* ============ 导出（供 node 测试） ============ */
  const API = {
    parseInput: parseInput,
    parseAny: parseAny,
    fromJSON: fromJSON,
    parseStructuredLines: parseStructuredLines,
    normalizeInput: normalizeInput,
    splitSenses: splitSenses,
    normCn: normCn,
    buildGroups: buildGroups,
    itemKey: itemKey,
    _internals: { shuffle: shuffle, scanPairs: scanPairs, textToSenses: textToSenses }
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  global.WordForge = API;

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
