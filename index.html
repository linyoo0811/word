<style>/* ===== 词锻 · styles ===== */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #080b0e;
  --bg-soft: #0d1217;
  --panel: #111820;
  --panel-2: #17202a;
  --line: #23303d;
  --line-soft: #1a2530;
  --text: #e9f0f7;
  --muted: #8d9dae;
  --dim: #5c6b7a;
  --accent: #b8f08e;
  --accent-ink: #0e1a06;
  --accent-soft: rgba(184, 240, 142, .12);
  --good: #7ee787;
  --bad: #ff7b72;
  --warn: #ffd166;
  --blue: #7dd3fc;
  --radius: 18px;
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  background-image:
    radial-gradient(900px 500px at 12% -10%, rgba(125, 211, 252, .10), transparent 60%),
    radial-gradient(800px 480px at 92% 0%, rgba(184, 240, 142, .08), transparent 60%),
    radial-gradient(700px 600px at 50% 120%, rgba(255, 209, 102, .05), transparent 60%);
  background-attachment: fixed;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--blue); }
::selection { background: rgba(184, 240, 142, .28); }

/* ----- layout ----- */
#app-root { max-width: 1060px; margin: 0 auto; padding: 0 20px 96px; }
.topbar {
  display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap;
  padding: 20px 4px 14px; position: sticky; top: 0; z-index: 40;
  background: linear-gradient(to bottom, rgba(8, 11, 14, .96) 60%, rgba(8, 11, 14, 0));
  backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px;
  display: grid; place-items: center; font-size: 23px; font-weight: 800;
  color: var(--accent-ink); background: linear-gradient(150deg, var(--accent), #7ed957);
  box-shadow: 0 8px 24px -10px rgba(184, 240, 142, .8);
  font-family: var(--serif);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 19px; letter-spacing: .06em; }
.brand-text span { font-size: 12px; color: var(--dim); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tab {
  border: 1px solid transparent; background: transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
  transition: .18s; position: relative;
}
.tab:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
.tab.active { color: var(--accent); background: var(--accent-soft); border-color: rgba(184, 240, 142, .28); }
.tab .dot {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px;
  font-size: 11px; line-height: 18px; text-align: center; border-radius: 9px;
  background: var(--warn); color: #241a00; font-weight: 800; vertical-align: 1px;
}
main { display: block; }
.view { display: none; animation: fadeUp .28s ease both; }
.view.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ----- panels ----- */
.panel {
  background: linear-gradient(180deg, var(--panel), var(--bg-soft));
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.panel-head { margin-bottom: 14px; }
.panel-head h2 { font-size: 17px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-head p { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.sub { color: var(--dim); font-size: 13px; }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; flex-wrap: wrap; }
.row.center { justify-content: center; }
.spacer { flex: 1 1 auto; }
.badge {
  display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; background: var(--panel-2); color: var(--muted);
  border: 1px solid var(--line);
}
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(184, 240, 142, .3); }
.badge.warn { background: rgba(255, 209, 102, .12); color: var(--warn); border-color: rgba(255, 209, 102, .3); }
.badge.bad { background: rgba(255, 123, 114, .12); color: var(--bad); border-color: rgba(255, 123, 114, .3); }

/* ----- buttons ----- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--text); padding: 10px 16px; font-size: 14px; font-weight: 600;
  transition: transform .12s, background .18s, border-color .18s, opacity .18s;
  white-space: nowrap;
}
.btn:hover { background: #1e2935; border-color: #2e3d4d; }
.btn:active { transform: translateY(1px) scale(.995); }
.btn.primary {
  background: linear-gradient(160deg, var(--accent), #96e06a); color: var(--accent-ink);
  border-color: transparent; box-shadow: 0 10px 26px -14px rgba(184, 240, 142, .9);
}
.btn.primary:hover { filter: brightness(1.05); background: linear-gradient(160deg, var(--accent), #96e06a); }
.btn.ghost { background: transparent; }
.btn.danger-ghost { background: transparent; color: var(--bad); border-color: rgba(255, 123, 114, .3); }
.btn.danger-ghost:hover { background: rgba(255, 123, 114, .1); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.lg { padding: 14px 26px; font-size: 16px; border-radius: 14px; }
.icon-btn {
  border: 1px solid transparent; background: transparent; color: var(--dim);
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  font-size: 15px; transition: .15s;
}
.icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, .07); }

/* ----- forms ----- */
textarea, input:not([type=checkbox]):not([type=radio]):not([type=file]):not(.slot-input), select {
  width: 100%; background: #0b1116; border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 13px; color: var(--text); outline: none;
  transition: border-color .18s, box-shadow .18s; font-size: 14px;
}
textarea:focus, input:focus, select:focus {
  border-color: rgba(184, 240, 142, .55); box-shadow: 0 0 0 3px rgba(184, 240, 142, .12);
}
textarea { resize: vertical; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: #4c5a68; }
#raw-input { min-height: 240px; font-family: var(--mono); font-size: 13.5px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
label.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

/* ----- import ----- */
.parse-hint { font-size: 12.5px; color: var(--dim); }
.parse-hint b { color: var(--accent); }
.draft-row {
  display: grid; grid-template-columns: minmax(140px, 1.05fr) minmax(240px, 2fr) 32px;
  gap: 8px; align-items: start; padding: 10px; border-radius: 12px;
  border: 1px solid var(--line-soft); background: rgba(255, 255, 255, .015); margin-bottom: 8px;
}
.draft-row .dr-main { display: flex; flex-direction: column; gap: 6px; }
.draft-row input, .draft-row textarea { padding: 8px 10px; font-size: 13.5px; border-radius: 9px; }
.draft-row .in-en { font-family: var(--serif); font-size: 16px; font-weight: 700; }
.draft-row .in-sense { min-height: 38px; resize: none; line-height: 1.55; }
.draft-row .del { align-self: start; }
.draft-row .in-ex { grid-column: 1 / -1; font-size: 12.5px; padding: 6px 10px; color: var(--muted); }
.draft-row .in-ex::placeholder { color: #3c4854; }
.draft-row .dr-note { grid-column: 1 / -1; font-size: 12.5px; color: #9fb0c0; padding: 2px 2px 0; }
.draft-row.bad-row { border-color: rgba(255, 123, 114, .4); }
.issue { font-size: 12.5px; color: var(--warn); padding: 6px 2px; }
.issue b { color: var(--text); }
.group-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.group-chip {
  border: 1px dashed rgba(125, 211, 252, .35); background: rgba(125, 211, 252, .06);
  border-radius: 10px; padding: 6px 11px; font-size: 12.5px; color: var(--muted);
}
.group-chip b { color: var(--blue); font-weight: 700; }

/* ----- library ----- */
.lib-item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: rgba(255, 255, 255, .012); }
.lib-item:hover { border-color: var(--line); }
.lib-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lib-word { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.lib-phon { color: var(--dim); font-size: 13px; font-family: var(--mono); }
.lib-senses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sense-tag.ok { border-color: rgba(184, 240, 142, .45); background: rgba(184, 240, 142, .10); color: var(--accent); }
.sense-tag.bad { border-color: rgba(255, 123, 114, .45); background: rgba(255, 123, 114, .08); color: var(--bad); }
.sense-tag {
  font-size: 13px; padding: 3px 9px; border-radius: 8px; background: var(--panel-2);
  border: 1px solid var(--line-soft); color: #cdd9e5;
}
.sense-tag .pos { color: var(--accent); font-size: 11.5px; margin-right: 3px; font-weight: 700; }
.lib-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 9px; font-size: 12px; color: var(--dim); }
.lib-edit { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 8px; }
.lib-edit .row { gap: 8px; }
.empty { text-align: center; padding: 46px 20px; color: var(--dim); font-size: 14px; }
.empty .big { font-size: 34px; margin-bottom: 10px; opacity: .6; }

/* ----- practice setup ----- */
.hero-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat {
  background: rgba(255, 255, 255, .02); border: 1px solid var(--line-soft);
  border-radius: 14px; padding: 13px 14px; text-align: center;
}
.stat b { display: block; font-size: 25px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--dim); }
.stat .s2 { display: block; font-size: 11px; color: #4f5c69; margin-top: 2px; }
.stat.hi b { color: var(--accent); }
.stat.warn b { color: var(--warn); }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 12px; margin-bottom: 16px; }
.mode-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 560px; }
.mode-card {
  text-align: left; border: 1px solid var(--line-soft); border-radius: 16px;
  background: linear-gradient(180deg, var(--panel), var(--bg-soft)); padding: 16px;
  transition: .18s; display: flex; flex-direction: column; gap: 4px; position: relative;
}
.mode-card:hover { border-color: #33465a; }
.mode-card.slim:hover { transform: none; }
.mode-card.sel { border-color: rgba(184, 240, 142, .55); background: linear-gradient(180deg, rgba(184, 240, 142, .1), var(--bg-soft)); box-shadow: 0 0 0 1px rgba(184, 240, 142, .25) inset; }
.mode-card.disabled { opacity: .45; pointer-events: none; }
.mode-card .mi { font-size: 20px; }
.mode-card .mt { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.mode-card .md { font-size: 12.5px; color: var(--muted); }
.mode-card .mtag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: rgba(255, 255, 255, .06); color: var(--dim); font-weight: 600; }

/* 精简模式卡 */
.mode-card.slim { flex-direction: column; align-items: flex-start; gap: 5px; padding: 14px 16px; min-height: 0; }
.mode-card.slim .mt { font-size: 17px; font-weight: 650; letter-spacing: .01em; }
.mode-card.slim .md.count { font-size: 12.5px; color: var(--dim); margin: 0; }
.mode-card.slim .mi { display: none; }

.start-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg {
  display: inline-flex; align-items: center; gap: 3px;
  background: #0b1116; border: 1px solid var(--line); border-radius: 12px;
  padding: 3px 4px 3px 11px;
}
.seg-label { font-size: 12.5px; color: var(--dim); margin-right: 5px; }
.seg-btn {
  border: 0; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 700;
  padding: 6px 12px; border-radius: 9px; transition: background .15s, color .15s;
  font-variant-numeric: tabular-nums;
}
.seg-btn:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
.seg-btn.on { background: var(--accent); color: var(--accent-ink); }
.seg-btn.on:hover { background: var(--accent); color: var(--accent-ink); }
.seg.sm { padding: 3px 4px 3px 10px; }
.seg.sm .seg-btn { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.seg.sm .seg-label { font-size: 12px; }
.lib-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.other-modes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -4px 0 16px; }
.mode-pill { border-radius: 999px; padding: 7px 14px; }
.mode-pill.on { border-color: rgba(184, 240, 142, .55); color: var(--accent); background: var(--accent-soft); }
.mode-pill .pill-n { margin-left: 7px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
.mode-pill.on .pill-n { color: var(--accent); }

/* 填空框 */
.slots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; align-items: stretch; }
.add-slot {
  flex: 0 0 auto; width: 52px; min-height: 58px; border-radius: 13px;
  border: 1.5px dashed #2b3a48; background: transparent; color: var(--dim);
  font-size: 21px; line-height: 1; cursor: pointer; transition: .15s;
}
.add-slot:hover { border-color: rgba(184, 240, 142, .45); color: var(--accent); background: rgba(184, 240, 142, .06); }
.shake { animation: wf-shake .3s; }
@keyframes wf-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.slot-input {
  flex: 1 1 200px; max-width: 330px; min-height: 58px; padding: 12px 16px;
  border-radius: 13px; border: 1.5px solid var(--line); background: #0b1116;
  color: var(--text); font-size: 17px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.slot-input::placeholder { color: #3b4855; font-size: 14px; letter-spacing: .05em; }
.slot-input.en { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .01em; }
.slot-input:focus { border-color: rgba(184, 240, 142, .55); box-shadow: 0 0 0 3px rgba(184, 240, 142, .12); }
.slot-input.ok { border-color: rgba(184, 240, 142, .7); background: rgba(184, 240, 142, .10); color: var(--accent); pointer-events: none; cursor: default; }
.slot-input.bad { border-color: rgba(255, 123, 114, .65); background: rgba(255, 123, 114, .08); color: var(--bad); }
.slot-input.extra { border-color: var(--line); color: var(--dim); }
.slot-input.missed { border-color: rgba(255, 209, 102, .55); border-style: dashed; }
.ca-miss { font-size: 15px; padding: 7px 13px; border-radius: 10px; border: 1px dashed rgba(255, 209, 102, .45); color: var(--warn); }

/* ----- practice run ----- */
.run-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.progress { flex: 1; height: 6px; background: #16202a; border-radius: 999px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--blue)); border-radius: 999px; transition: width .35s ease; }
.counter { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
.stage { min-height: 340px; }
.q-kind { font-size: 12px; color: var(--dim); letter-spacing: .06em; margin-bottom: 14px; }
.q-kind b { color: var(--accent); }
.cn-prompt { font-size: clamp(26px, 5vw, 38px); font-weight: 700; line-height: 1.35; letter-spacing: .01em; }
.cn-prompt .pos { color: var(--accent); font-size: .55em; vertical-align: .18em; margin-right: 6px; font-family: var(--mono); }
.word-lg { font-family: var(--serif); font-size: clamp(38px, 8vw, 62px); font-weight: 700; line-height: 1.1; letter-spacing: .01em; word-break: break-word; }
.word-lg.sm { font-size: clamp(28px, 5vw, 40px); }
.phon-line { display: flex; align-items: center; gap: 12px; margin-top: 6px; color: var(--dim); font-family: var(--mono); font-size: 14px; }
.q-note { margin-top: 9px; font-size: 13px; line-height: 1.55; color: #9fb0c0; max-width: 760px; }
.q-count { margin-top: 9px; }
.vline { font-size: 14px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.vline.good { color: var(--good); }
.vline.bad { color: var(--bad); }
.vline.warn { color: var(--warn); }

/* 数量挑战 */
.nums { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.num {
  min-width: 66px; height: 66px; padding: 0 16px;
  border-radius: 15px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02);
  color: var(--text); font-size: 27px; font-weight: 800;
  font-variant-numeric: tabular-nums; transition: .15s;
}
.num:hover { border-color: #3a4b5e; background: rgba(255, 255, 255, .05); transform: translateY(-1px); }
.num.ok { border-color: rgba(126, 231, 135, .6); background: rgba(126, 231, 135, .13); color: var(--good); }
.num.bad { border-color: rgba(255, 123, 114, .6); background: rgba(255, 123, 114, .13); color: var(--bad); }
.num.warn { border-color: rgba(255, 209, 102, .6); background: rgba(255, 209, 102, .13); color: var(--warn); }

/* 数量挑战：答完后的答案面板 */
.count-answer {
  margin-top: 16px; padding: 18px 20px; border-radius: 16px;
  border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .015));
}
.ca-title { font-size: 16px; color: var(--muted); letter-spacing: .01em; }
.ca-title b { color: var(--accent); font-size: 22px; font-weight: 800; margin: 0 3px; }
.ca-list { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
.ca-list .sense-tag { font-size: 15.5px; padding: 7px 13px; border-radius: 10px; }
.ca-list .sense-tag .pos { font-size: 12.5px; }
.ca-word {
  font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: .01em;
  padding: 5px 12px; border-radius: 10px; background: var(--panel-2);
  border: 1px solid rgba(184, 240, 142, .28); color: var(--accent);
}
.ca-note { margin-top: 14px; font-size: 13.5px; line-height: 1.6; color: #9fb0c0; }
.answer-extra {
  margin-top: 14px; padding: 12px 15px; border-radius: 12px;
  border: 1px solid var(--line-soft); background: rgba(255, 255, 255, .02);
  font-size: 13px; line-height: 1.65; color: #9fb0c0;
  display: flex; flex-direction: column; gap: 6px;
}
.answer-extra b { color: var(--text); font-family: var(--serif); font-size: 15px; }
.speak {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px;
  width: 32px; height: 32px; display: grid; place-items: center; font-size: 14px; color: var(--muted);
}
.speak:hover { color: var(--accent); border-color: rgba(184, 240, 142, .4); }
.answer-input {
  width: 100%; margin-top: 22px; font-size: 26px; padding: 14px 18px; text-align: center;
  font-family: var(--sans); letter-spacing: .04em; border-radius: 14px; font-weight: 600;
}
.answer-input::placeholder { color: #3d4a57; font-weight: 400; font-size: 17px; letter-spacing: 0; }
.hint-box { margin-top: 12px; font-size: 14px; color: var(--warn); min-height: 22px; text-align: center; font-family: var(--mono); letter-spacing: .12em; }
.shake { animation: shake .35s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.actions.center { justify-content: center; }
.kb { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); }
.stage-foot { margin-top: 18px; text-align: center; font-size: 12px; color: #46545f; }

/* options */
.options { display: grid; gap: 9px; margin-top: 20px; }
.option {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .02);
  border-radius: 12px; padding: 13px 16px; font-size: 16px; transition: .15s;
}
.option:hover { border-color: #3a4b5e; background: rgba(255, 255, 255, .04); }
.option .mark {
  width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; border: 1.5px solid #33424f;
  display: grid; place-items: center; font-size: 12px; color: transparent;
}
.option.picked { border-color: rgba(125, 211, 252, .6); background: rgba(125, 211, 252, .1); }
.option.picked .mark { border-color: var(--blue); background: var(--blue); color: #04121a; }
.option.ok { border-color: rgba(126, 231, 135, .6); background: rgba(126, 231, 135, .1); }
.option.ok .mark { border-color: var(--good); background: var(--good); color: #04140a; }
.option.bad { border-color: rgba(255, 123, 114, .55); background: rgba(255, 123, 114, .1); }
.option.bad .mark { border-color: var(--bad); background: var(--bad); color: #1a0503; }
.option.missed { border-color: rgba(126, 231, 135, .6); background: rgba(126, 231, 135, .1); }
.option.missed .mark { border-color: var(--good); background: var(--good); color: #04140a; }
.options.en .option > span:last-child { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .01em; }

/* feedback */
.fb { margin-top: 18px; border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); animation: pop .22s ease both; }
@keyframes pop { from { opacity: 0; transform: scale(.985) translateY(6px); } to { opacity: 1; transform: none; } }
.fb.good { border-color: rgba(126, 231, 135, .4); background: rgba(126, 231, 135, .07); }
.fb.bad { border-color: rgba(255, 123, 114, .4); background: rgba(255, 123, 114, .06); }
.fb-title { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.fb.good .fb-title { color: var(--good); }
.fb.bad .fb-title { color: var(--bad); }
.answer-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0; }
.answer-line .lbl { font-size: 12px; color: var(--dim); min-width: 52px; }
.answer-line .val { font-family: var(--serif); font-size: 24px; font-weight: 700; }
.answer-line .val .wrong-char { color: var(--bad); text-decoration: line-through; text-decoration-color: rgba(255,123,114,.7); }
.answer-line .val .ok-char { color: var(--good); }
.fb .senses { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.fb .ex { margin-top: 10px; font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.fb .ex i { color: var(--text); font-style: normal; font-family: var(--serif); }
.fb .also { margin-top: 10px; font-size: 13px; color: var(--muted); }
.fb .also b { color: var(--blue); font-family: var(--serif); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px;
  padding: 4px 10px; font-size: 13.5px; font-family: var(--serif); display: inline-flex; gap: 6px; align-items: center;
}
.chip.ok { border-color: rgba(126, 231, 135, .5); color: var(--good); background: rgba(126, 231, 135, .08); }
.chip.miss { border-color: rgba(255, 209, 102, .4); color: var(--warn); background: rgba(255, 209, 102, .07); }
.chip .x { color: var(--dim); cursor: pointer; font-family: var(--sans); }

/* flash */
.flash-card { text-align: center; padding: 24px 0 8px; }
.flash-reveal { margin-top: 22px; min-height: 70px; transition: .2s; }
.flash-senses { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.flash-senses .fs { font-size: 20px; }
.flash-senses .fs .pos { color: var(--accent); font-family: var(--mono); font-size: 13px; margin-right: 8px; }
.hidden-senses { color: #2c3843; user-select: none; letter-spacing: .3em; }

/* summary */
.sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.wrong-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* stats */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; margin-top: 18px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
.bar-col .b { width: 100%; max-width: 54px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--accent), rgba(184, 240, 142, .25)); min-height: 3px; transition: height .4s; }
.bar-col .b.zero { background: #1b2530; }
.bar-col .d { font-size: 11px; color: var(--dim); }
.bar-col .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 添加到主屏幕提示 */
.install-tip {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(14, 19, 24, .97); border: 1px solid var(--line);
  box-shadow: 0 14px 44px rgba(0, 0, 0, .55);
  font-size: 13px; color: var(--muted); line-height: 1.55;
  backdrop-filter: blur(10px);
}
.install-tip .it-text { flex: 1; }
.install-tip b { color: var(--text); font-weight: 600; }

/* 拼写纠正提示 */
.spell-hint { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.spell-hint[hidden] { display: none; }
.spell-hint .sh-label { color: var(--dim); }
.spell-hint .sh-word {
  border: 1px dashed rgba(184, 240, 142, .45); background: rgba(184, 240, 142, .08);
  color: var(--accent); border-radius: 9px; padding: 5px 12px; font-size: 15px;
  font-family: var(--serif); font-weight: 600; cursor: pointer; transition: .15s;
}
.spell-hint .sh-word:hover { background: rgba(184, 240, 142, .18); }

body.has-install-tip { padding-bottom: 92px; }
.install-tip .it-x { border: 0; background: transparent; color: var(--dim); font-size: 15px; padding: 6px; cursor: pointer; }

.top-wrong { display: flex; flex-direction: column; gap: 7px; }
.affix-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.affix-row { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: baseline; font-size: 13.5px; }
.affix-row b { color: var(--accent); font-family: var(--mono); font-size: 13px; font-weight: 700; }
.affix-row span { color: var(--muted); line-height: 1.6; }
@media (max-width: 720px) { .affix-row { grid-template-columns: 1fr; gap: 2px; } }
.tw-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.tw-row .w { font-family: var(--serif); font-size: 16px; flex: 1; }
.tw-row .n { color: var(--bad); font-size: 12.5px; font-weight: 700; }
.tw-row .cn { color: var(--dim); font-size: 12.5px; }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: #1c2733; border: 1px solid var(--line); color: var(--text);
  padding: 11px 20px; border-radius: 999px; font-size: 14px; opacity: 0;
  pointer-events: none; transition: .25s; z-index: 99; box-shadow: 0 14px 40px -12px #000;
  max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.ok { border-color: rgba(126, 231, 135, .5); }
#toast.err { border-color: rgba(255, 123, 114, .5); }

/* misc */
.hr { height: 1px; background: var(--line-soft); margin: 16px 0; }
.kbd-hint { color: #46545f; font-size: 12px; }
.kbd-hint .kb { margin: 0 2px; }

@media (max-width: 720px) {
  #app-root { padding: 0 12px 80px; }
  input:not([type=checkbox]), textarea, select { font-size: 16px; }
  .draft-row input, .draft-row textarea { font-size: 15px; }
  .topbar { padding-top: 14px; gap: 10px; }
  .brand-text span { display: none; }
  .tabs { width: 100%; margin-left: 0; justify-content: space-between; }
  .tab { padding: 7px 10px; font-size: 13px; flex: 1; text-align: center; }
  .tab .dot { display: none; }

<script>/* ============================================================
   word — 输出式背单词   1) 混乱输入 → 结构化单词卡（一词多义合并 / 同义自动成组）
   2) 练习：一词多义 / 一义多词，各分普通（选项）与进阶（打字）
   3) 间隔重复（SRS）+ 本地保存
   ============================================================ */
(function (global) {
  'use strict';

  /* ============ 0. 小工具 ============ */
  const CN_RE = /[\u4e00-\u9fff]/;
  const EN_RE = /[A-Za-z]/;
  const DAY = 86400000;
  const now = () => Date.now();
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const pad2 = (n) => String(n).padStart(2, '0');

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function todayKey(t) {
    const d = t ? new Date(t) : new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function uid(s) { return String(s || '').toLowerCase().trim(); }

  /* ============ 1. 解析器 ============ */
  const POS_WORDS = ['n', 'v', 'vt', 'vi', 'adj', 'adv', 'prep', 'conj', 'pron', 'num', 'art',
    'aux', 'int', 'interj', 'abbr', 'phr', 'pl', 'det', 'modal'];
  const POS_CN = {
    '名词': 'n.', '动词': 'v.', '形容词': 'adj.', '副词': 'adv.', '介词': 'prep.',
    '连词': 'conj.', '代词': 'pron.', '数词': 'num.', '冠词': 'art.', '感叹词': 'int.', '助动词': 'aux.'
  };
  const POS_TOKEN = new RegExp('\\b(?:' + POS_WORDS.join('|') + ')\\.|(?:' + Object.keys(POS_CN).join('|') + ')', 'gi');
  const EN_TOKEN = "[A-Za-z][A-Za-z'’\\-]*";
  const EN_SEQ = EN_TOKEN + '(?:\\s+' + EN_TOKEN + '){0,3}';
  const EN_GROUP = EN_SEQ + '(?:\\s*[,/&]\\s*' + EN_SEQ + ')*';
  const CN_PART = '([\\[（(【{]?[\\u4e00-\\u9fff][^A-Za-z]*)';
  const EDGE_PUNCT = /^[\s;,.|/\-–—:=+*~。，、；：·•"'“”‘’]+|[\s;,.|/\-–—:=+*~。，、；：·•"'“”‘’]+$/g;

  /** 去掉首尾标点，但保留成对的括号（如「（使）破产」） */
  function trimPunct(s) {
    let r = String(s || '').replace(EDGE_PUNCT, '');
    if (!r) return '';
    const PAIR = { '(': ')', '[': ']', '（': '）', '【': '】', '{': '}' };
    if (r.length > 1 && PAIR[r[0]] && PAIR[r[0]] === r[r.length - 1]) r = r.slice(1, -1).trim();
    r = r.replace(/^[)\]）】}]+/, '').replace(/[(\[（【{]+$/, '').trim();
    return r;
  }

  /** 词性标准化：v → v.  名词 → n. */
  function normPos(m) {
    const raw = String(m || '').trim();
    const lower = raw.toLowerCase();
    if (POS_CN[raw]) return POS_CN[raw];
    if (POS_CN[lower]) return POS_CN[lower];
    return /\.$/.test(raw) ? lower : lower + '.';
  }

  function normalizeInput(raw) {
    return String(raw || '')
      .replace(/^\uFEFF/, '')
      .replace(/\r\n?/g, '\n')
      .replace(/[，]/g, ',')
      .replace(/[；]/g, ';')
      .replace(/[：]/g, ':')
      .replace(/[（]/g, '(')
      .replace(/[）]/g, ')')
      .replace(/[、]/g, ',')
      .replace(/[。]/g, '.')
      .replace(/[［【]/g, '[')
      .replace(/[］】]/g, ']')
      .replace(/[／]/g, '/')
      .replace(/\u00A0/g, ' ')
      .replace(/[ \t]+/g, ' ');
  }

  /** 中文释义 → 用于分组/去重的归一化 key */
  function normCn(s) {
    return String(s || '')
      .replace(/\u0001/g, '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/[A-Za-z.]/g, '')
      .replace(/[\s\u3000]/g, '')
      .replace(/[，,。；;：:、/|“”"'‘’【】\[\]（）()…·—\-~]/g, '')
      .trim();
  }

  /** 一条释义文本 → 多个释义（按逗号/分号/斜杠/序号拆） */
  function splitSenses(str) {
    if (!str) return [];
    let s = String(str).replace(/\u0001/g, ';').replace(/\s+/g, ' ').trim();
    s = trimPunct(s);
    if (!s) return [];
    const parts = s.split(/\s*[;,|/]\s*|\s+\d{1,2}[.)]\s*/);
    const out = [];
    parts.forEach((p) => {
      let cn = trimPunct(trimPunct(p).replace(POS_TOKEN, ''));
      if (!cn || !CN_RE.test(cn)) return;
      const k = normCn(cn);
      if (!k) return;
      if (out.some((x) => normCn(x) === k)) return;
      out.push(cn);
    });
    return out;
  }

  function extractEnglishList(s) {
    const m = String(s || '').match(/[A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*){0,3}/g);
    return (m || []).map((x) => x.trim()).filter(Boolean);
  }
  function splitEnglishGroup(s) {
    return String(s || '').split(/\s*[,/&]\s*/).map((x) => x.trim()).filter((x) => EN_RE.test(x));
  }

  /** 从一段文本里抓「英文词 + 紧随其后的中文」配对 */
  function scanPairs(str, allowBracket) {
    const sep = '\\s*(?:[:\\-–—=→~|\\u0001' + (allowBracket ? '\\[\\]' : '') + ']\\s*)*';
    const re = new RegExp('(' + EN_GROUP + ')' + sep + CN_PART, 'g');
    const out = [];
    let m;
    while ((m = re.exec(str)) !== null) {
      out.push({ ens: m[1], cn: m[2] });
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    return out;
  }

  function parseExample(s) {
    const t = String(s || '').trim().replace(/^[;,\s]+/, '');
    const m = t.match(/^(.*?[A-Za-z].*?)\s*[-—–:]\s*([\u4e00-\u9fff].*)$/);
    if (m) return { en: m[1].trim(), cn: m[2].trim() };
    return { en: t, cn: '' };
  }

  function looksLikeSingleWord(s) { return /^[A-Za-z][A-Za-z'’\-]*(\s+[A-Za-z][A-Za-z'’\-]*){0,2}$/.test(s); }
  function looksLikePhonetic(s) { return /^[\/\[][^\/\]]{1,48}[\/\]]$/.test(s); }

  /** 预处理：把「单词一行、释义下一行」粘回去 */
  function mergeSplitLines(lines) {
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      if (!t) continue;
      if (looksLikeSingleWord(t)) {
        const n1 = (lines[i + 1] || '').trim();
        const n2 = (lines[i + 2] || '').trim();
        if (n1 && CN_RE.test(n1) && !EN_RE.test(n1)) { out.push(t + ' ' + n1); i += 1; continue; }
        if (n1 && looksLikePhonetic(n1) && n2 && CN_RE.test(n2) && !EN_RE.test(n2)) {
          out.push(t + ' ' + n1 + ' ' + n2); i += 2; continue;
        }
      }
      out.push(t);
    }
    return out;
  }

  function withPos(senses, posList) {
    if (!posList || !posList.length) return senses;
    if (posList.length === senses.length) {
      senses.forEach((s, i) => { if (!s.pos) s.pos = posList[i]; });
    } else {
      const p = posList.join('/');
      senses.forEach((s) => { if (!s.pos) s.pos = p; });
    }
    return senses;
  }

  /** 合并进卡片列表：同名单词 → 一词多义 */
  function upsertCard(list, en, senses, meta) {
    const id = uid(en);
    if (!id) return null;
    let card = list.find((c) => c.id === id);
    if (!card) {
      card = { id: id, en: String(en).trim(), phonetic: '', senses: [], examples: [], note: '', added: Date.now() };
      list.push(card);
    }
    if (meta && meta.phonetic && !card.phonetic) card.phonetic = meta.phonetic;
    (senses || []).forEach((s) => {
      const cn = String((s && s.cn) || '').replace(POS_TOKEN, '').trim();
      const k = normCn(cn);
      if (!k) return;
      if (card.senses.some((x) => normCn(x.cn) === k)) return;
      card.senses.push({ cn: cn, pos: (s && s.pos) || '' });
    });
    if (meta && meta.example && card.examples.length < 8) {
      const ex = parseExample(meta.example);
      if (ex.en && !card.examples.some((x) => x.en === ex.en)) card.examples.push(ex);
    }
    if (meta && meta.note && !card.note) card.note = String(meta.note).slice(0, 300);
    return card;
  }

  /** 在原始文本里找这一行是第几行（给用户看） */
  function lineNumberOf(fullText, needle) {
    const ls = String(fullText).split('\n');
    for (let i = 0; i < ls.length; i++) {
      if (ls[i].indexOf(needle) >= 0) return i + 1;
    }
    return 0;
  }

  /** 解析混乱输入 */
  function parseInput(raw) {
    const res = { cards: [], issues: [], groups: [] };
    const text = normalizeInput(raw);
    const lines = mergeSplitLines(text.split('\n'));
    let lastCard = null;

    lines.forEach((rawLine) => {
      let line = rawLine.trim();
      if (!line || /^[#/]{1,2}/.test(line)) return;
      if (/^\|?[\s|:\-]+\|?$/.test(line)) return; // markdown 分隔行
      line = line.replace(/^[-*•·+]\s*/, '').replace(/^\d{1,3}[.)、]\s*/, '').trim();
      if (!line) return;
      const lineNo = lineNumberOf(text, rawLine);

      // 独立例句行
      const mEx = line.match(/^(?:例|例句|例子|例文)\s*[:.]?\s*(.+)$/) || line.match(/^(?:e\.g\.|eg|ex)\s*[:.]\s*(.+)$/i);
      if (mEx && CN_RE.test(mEx[1]) && lastCard) {
        const ex = parseExample(mEx[1]);
        if (ex.en && lastCard.examples.length < 8) lastCard.examples.push(ex);
        return;
      }

      let work = line;
      let example = null;
      const mInline = work.match(/\s(?:例|例句|eg|e\.g\.|ex)\s*[:.]\s*(.+)$/i);
      if (mInline) { example = mInline[1].trim(); work = work.slice(0, mInline.index).trim(); }

      let phonetic = '';
      const mPh = work.match(/[\/\[][^\/\[\]\u4e00-\u9fff]{1,48}[\/\]]/);
      if (mPh) {
        const inner = mPh[0].slice(1, -1);
        const isSlash = mPh[0][0] === '/';
        // 方括号里的内容必须像音标（含非 ASCII 或 IPA 符号），否则可能是 [word] 这种写法
        const looksIpa = /[^\x00-\x7F]/.test(inner) || /[ˈˌːəθðʃʒŋɑɔɛɪʊʌæɜ]/.test(inner);
        if (isSlash || looksIpa) {
          phonetic = inner.trim();
          work = (work.slice(0, mPh.index) + ' ' + work.slice(mPh.index + mPh[0].length)).trim();
        }
      }

      const posList = [];
      work = work.replace(POS_TOKEN, (m) => { posList.push(normPos(m)); return ' \u0001 '; })
        .replace(/\(\s*\)/g, ' ').replace(/\[\s*\]/g, ' ')
        .replace(/[ \t]+/g, ' ').trim();
      if (!work) return;

      const hasCN = CN_RE.test(work);
      const hasEN = EN_RE.test(work);
      if (!hasCN && !hasEN) return;
      if (hasCN && !hasEN) {
        res.issues.push({ line: lineNo, text: line, why: '只有中文，没有单词' });
        return;
      }

      const created = [];

      if (hasCN) {
        // 形式一：中文 = 英文, 英文   （一个意思多个单词）
        const mCnFirst = work.match(/^([^A-Za-z]+?)\s*[:=]\s*(.+)$/);
        if (mCnFirst && CN_RE.test(mCnFirst[1]) && EN_RE.test(mCnFirst[2]) && !CN_RE.test(mCnFirst[2])) {
          const cnParts = splitSenses(mCnFirst[1]);
          const ens = extractEnglishList(mCnFirst[2]);
          if (cnParts.length && ens.length) {
            const senses = cnParts.map((cn) => ({ cn: cn, pos: '' }));
            withPos(senses, posList);
            ens.forEach((en) => created.push({ en: en, senses: senses.map((s) => ({ cn: s.cn, pos: s.pos })) }));
          }
        }
        // 形式二：英文 + 中文（最常见）
        if (!created.length) {
          let pairs = scanPairs(work, false);
          if (!pairs.length) pairs = scanPairs(work, true);
          pairs.forEach((p) => {
            const senses = [];
            let k = -1;
            String(p.cn).split('\u0001').forEach((seg) => {
              const parts = splitSenses(seg);
              if (!parts.length) return;
              k += 1;
              const pos = posList.length ? (posList[k] || posList[posList.length - 1]) : '';
              parts.forEach((cn) => senses.push({ cn: cn, pos: pos }));
            });
            if (!senses.length) return;
            splitEnglishGroup(p.ens).forEach((en) => created.push({ en: en, senses: senses.map((s) => ({ cn: s.cn, pos: s.pos })) }));
          });
        }
        // 形式三：兜底——中文在前（苹果 apple / 苹果: apple）
        if (!created.length) {
          const iCn = work.search(CN_RE);
          const prefix = iCn > 0 ? work.slice(0, iCn) : '';
          const suffix = iCn >= 0 ? work.slice(iCn) : work;
          let en = extractEnglishList(prefix)[0];
          let cnText = suffix;
          if (!en) {
            const all = extractEnglishList(work);
            en = all[0] || '';
            cnText = en ? work.replace(en, ' ') : work;
          }
          const cnParts = splitSenses(cnText);
          if (en && cnParts.length) {
            const senses = cnParts.map((cn) => ({ cn: cn, pos: '' }));
            withPos(senses, posList);
            created.push({ en: en, senses: senses });
          }
        }
      }

      if (!created.length) {
        if (hasEN && !hasCN) {
          const ens = extractEnglishList(work);
          if (!ens.length) return;
          ens.forEach((en) => created.push({ en: en, senses: [] }));
          res.issues.push({ line: lineNo, text: line, why: '只有英文，先收下，稍后补释义' });
        } else {
          res.issues.push({ line: lineNo, text: line, why: '没认出单词，已跳过' });
          return;
        }
      }

      created.forEach((c) => {
        const card = upsertCard(res.cards, c.en, c.senses, { phonetic: phonetic, example: example });
        if (card) lastCard = card;
      });
    });

    res.groups = buildGroups(res.cards);
    return res;
  }

  /* ---- 结构化输入：整理好的数据直接进库，不靠猜 ---- */

  /** "v. 放弃 ; n. 放纵" → [{pos:'v.',cn:'放弃'},{pos:'n.',cn:'放纵'}] */
  function sensesFromText(text) {
    const out = [];
    String(text || '').split(/[;；]/).forEach((seg) => {
      let s = seg.trim();
      if (!s) return;
      const m = s.match(/^([a-z]+\.)\s*(.+)$/i);
      const pos = m ? m[1].toLowerCase() : '';
      const body = m ? m[2] : s;
      splitSenses(body).forEach((cn) => out.push({ cn: cn, pos: pos }));
    });
    return out;
  }

  /** 表格行：en | 音标 | v. 放弃 ; v. 遗弃 | 例: ... */
  function parseStructuredLines(text) {
    const lines = String(text).split('\n').map((l) => l.trim()).filter((l) => l && !/^#/.test(l));
    if (!lines.length) return null;
    const cards = [];
    const issues = [];
    let hit = 0;
    lines.forEach((line, i) => {
      const parts = line.split('|').map((s) => s.trim());
      const en = parts[0] || '';
      if (parts.length < 2 || !/^[A-Za-z][A-Za-z'’\-.,!?() ]*$/.test(en)) {
        issues.push({ line: i + 1, text: line, why: '不是「单词 | 音标 | 释义」格式，已跳过' });
        return;
      }
      hit += 1;
      let phonetic = '';
      let example = null;
      let note = '';
      const senses = [];
      // 第 2 列如果既没有中文、后面又跟着带中文的释义，就认定它是音标（纯 ASCII 音标也能认）
      const rawPh = parts[1] || '';
      if (rawPh && !CN_RE.test(rawPh) && parts.slice(2).some((f) => CN_RE.test(f))) {
        phonetic = rawPh.replace(/^[\/\[]+|[\/\]]+$/g, '').trim();
      }
      parts.slice(1).forEach((f) => {
        if (!f) return;
        if (/^(注|备注|笔记|note|tip)\s*[:.]/i.test(f)) {
          note = f.replace(/^(注|备注|笔记|note|tip)\s*[:.]\s*/i, '');
          return;
        }
        if (!phonetic && !CN_RE.test(f) && (/[^\x00-\x7F]/.test(f) || /^[\/\[]/.test(f))) {
          phonetic = f.replace(/^[\/\[]+|[\/\]]+$/g, '').trim();
          return;
        }
        if (/^(例|例句|eg|e\.g\.|ex)\s*[:.]/i.test(f)) {
          example = f.replace(/^(例|例句|eg|e\.g\.|ex)\s*[:.]\s*/i, '');
          return;
        }
        sensesFromText(f).forEach((s) => senses.push(s));
      });
      upsertCard(cards, en, senses, { phonetic: phonetic, example: example, note: note });
    });
    if (!hit || hit / lines.length < 0.6) return null;
    return { cards: cards, issues: issues, groups: buildGroups(cards), format: 'table' };
  }

  /** JSON：{cards:[...]} 或 [...] */
  function fromJSON(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    let arr = null;
    if (Array.isArray(data)) arr = data;
    else if (data && Array.isArray(data.cards)) arr = data.cards;
    else if (data && Array.isArray(data.words)) arr = data.words;
    if (!arr) return null;
    const cards = [];
    const issues = [];
    arr.forEach((item, i) => {
      if (!item) return;
      if (typeof item === 'string') { upsertCard(cards, item, [], {}); return; }
      const en = item.en || item.word || item.term || '';
      if (!en) {
        issues.push({ line: i + 1, text: JSON.stringify(item).slice(0, 40), why: '缺少 en 字段，已跳过' });
        return;
      }
      const senses = [];
      if (Array.isArray(item.senses)) {
        item.senses.forEach((s) => {
          if (typeof s === 'string') { sensesFromText(s).forEach((x) => senses.push(x)); return; }
          if (s && (s.cn || s.meaning)) {
            const cn = String(s.cn || s.meaning).trim();
            if (cn) senses.push({ cn: cn, pos: s.pos || '' });
          }
        });
      } else if (item.cn || item.meaning) {
        sensesFromText((item.pos ? item.pos + ' ' : '') + (item.cn || item.meaning)).forEach((x) => senses.push(x));
      }
      const card = upsertCard(cards, en, senses, { phonetic: item.phonetic || item.ipa || '' });
      if (!card) return;
      if (item.note) card.note = String(item.note).slice(0, 300);
      if (Array.isArray(item.examples)) {
        item.examples.forEach((e) => {
          const ex = typeof e === 'string' ? parseExample(e) : { en: (e && e.en) || '', cn: (e && e.cn) || '' };
          if (ex.en && card.examples.length < 8 && !card.examples.some((x) => x.en === ex.en)) card.examples.push(ex);
        });
      }
    });
    return { cards: cards, issues: issues, groups: buildGroups(cards), format: 'json' };
  }

  /** 统一入口：自动识别 JSON / 表格行 / 原始乱文本 */
  function parseAny(text) {
    const t = String(text || '').replace(/^\uFEFF/, '').trim();
    if (!t) return { cards: [], issues: [], groups: [], format: 'empty' };
    if (t[0] === '[' || t[0] === '{') {
      const j = fromJSON(t);
      if (j) return j;
    }
    const tb = parseStructuredLines(t);
    if (tb) return tb;
    const r = parseInput(t);
    r.format = 'loose';
    return r;
  }

  /** 释义组 key：同一个中文意思 + 同一个词性 才算同义（defend 和 defense 不会混在一起） */
  function senseKey(sense) {
    return normCn((sense && sense.cn) || '') + '|' + posKey(sense);
  }

  /** 同一个中文释义 + 同一个词性 → 多个英文单词 */
  function buildGroups(cards) {
    const map = new Map();
    (cards || []).forEach((c) => {
      (c.senses || []).forEach((s) => {
        if (!normCn(s.cn)) return;
        const k = senseKey(s);
        let g = map.get(k);
        if (!g) { g = { key: k, cn: s.cn, pos: (s.pos || ''), members: [] }; map.set(k, g); }
        if (!g.members.some((m) => m.id === c.id)) g.members.push({ id: c.id, en: c.en });
      });
    });
    return Array.from(map.values()).filter((g) => g.members.length > 1);
  }

  function emptyState() {
    return {
      version: 1,
      cards: [],
      srs: {},
      seen: {},
      log: [],
      daily: {},
      seeded: false,
      wiped: false,
      settings: { mode: 'sense', level: 'normal', limit: 20, autoSpeak: true },
      created: now()
    };
  }
  let state = emptyState();

  function seedState() {
    const base = emptyState();
    if (Array.isArray(SEED_CARDS) && SEED_CARDS.length) {
      base.cards = JSON.parse(JSON.stringify(SEED_CARDS));
      base.seeded = true;
      base._justSeeded = true;
    }
    return base;
  }

  function loadState() {
    let st = null;
    try {
      const raw = global.localStorage && localStorage.getItem(LS_KEY);
      if (raw) st = JSON.parse(raw);
    } catch (e) { st = null; }
    if (!st) return seedState();
    const base = emptyState();
    const merged = Object.assign(base, st);
    merged.settings = Object.assign(base.settings, st.settings || {});
    if (!Array.isArray(merged.cards)) merged.cards = [];
    if (!merged.srs || typeof merged.srs !== 'object') merged.srs = {};
    if (!merged.seen || typeof merged.seen !== 'object') merged.seen = {};
    if (!Array.isArray(merged.log)) merged.log = [];
    if (!merged.daily || typeof merged.daily !== 'object') merged.daily = {};
    // 空词库 + 没主动清空过 → 自动装入内置词库
    if (!merged.wiped && merged.cards.length === 0 && Array.isArray(SEED_CARDS) && SEED_CARDS.length) {
      merged.cards = JSON.parse(JSON.stringify(SEED_CARDS));
      merged.seeded = true;
      merged._justSeeded = true;
    }
    return merged;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式 */ }
  }
  function dailyBucket() {
    const k = todayKey();
    if (!state.daily[k]) state.daily[k] = { seen: 0, correct: 0, wrong: 0, words: 0 };
    return state.daily[k];
  }

  /* ---- 学习时长 ---- */
  function flushTime() {
    if (!P.startedAt) return;
    const dt = now() - P.startedAt;
    P.startedAt = now();
    if (dt < 3000 || dt > 3 * 3600 * 1000) return;   // 少于 3 秒 / 超过 3 小时的不算
    state.totalTime = (state.totalTime || 0) + dt;
    const d = dailyBucket();
    d.time = (d.time || 0) + dt;
    saveState();
  }

  function fmtDur(ms) {
    const m = Math.floor((ms || 0) / 60000);
    if (!ms) return '0 分钟';
    if (m < 1) return '不到 1 分钟';
    if (m < 60) return m + ' 分钟';
    const h = Math.floor(m / 60);
    const r = m % 60;
    return h + ' 小时' + (r ? ' ' + r + ' 分' : '');
  }

  /* ============ 3. 学习项 & 记忆调度 ============ */
  function itemKey(card, sense, level) {
    return card.id + '::' + normCn(sense.cn) + '::' + (level === 'hard' ? 'h' : 'n');
  }

  /** 两条记忆里取更熟的一条（词库/统计用） */
  function bestRec(a, b) {
    if (!a && !b) return null;
    if (!a) return b;
    if (!b) return a;
    if ((a.box || 0) !== (b.box || 0)) return (a.box || 0) > (b.box || 0) ? a : b;
    return (a.seen || 0) >= (b.seen || 0) ? a : b;
  }

  function collectItems(level) {
    const lv = level === 'hard' ? 'hard' : 'normal';
    const out = [];
    state.cards.forEach((card) => {
      (card.senses || []).forEach((sense, i) => {
        const kn = itemKey(card, sense, 'normal');
        const kh = itemKey(card, sense, 'hard');
        const rn = state.srs[kn] || null;
        const rh = state.srs[kh] || null;
        out.push({
          card: card, sense: sense, idx: i,
          key: lv === 'hard' ? kh : kn,
          rec: lv === 'hard' ? rh : rn,
          recN: rn, recH: rh, best: bestRec(rn, rh)
        });
      });
    });
    return out;
  }

  function isNew(rec) { return !rec || !rec.seen; }

  function sortForReview(pool) {
    const due = [], fresh = [], later = [];
    pool.forEach((it) => {
      if (isNew(it.rec)) fresh.push(it);
      else if (it.rec.due <= now()) due.push(it);
      else later.push(it);
    });
    due.sort((a, b) => a.rec.due - b.rec.due);
    shuffle(fresh);
    later.sort((a, b) => (a.rec.box - b.rec.box) || (a.rec.due - b.rec.due));
    return due.concat(fresh, later);
  }

  function bumpRec(rec, ok) {
    rec.seen += 1;
    rec.last = now();
    if (ok) {
      rec.right += 1;
      rec.box = clamp(rec.box + 1, 0, BOX_MAX);
      rec.due = now() + INTERVALS[rec.box];
    } else {
      rec.wrong += 1;
      rec.box = clamp(rec.box - 1, 0, BOX_MAX);
      rec.due = now() + RETRY_GAP;
    }
  }

  function ensureRec(key) {
    if (!state.srs[key]) state.srs[key] = { box: 0, due: 0, seen: 0, right: 0, wrong: 0, last: 0 };
    return state.srs[key];
  }

  /** wholeCard=true：这个词的所有意思一起记（一词多义答的是整词） */
  function recordAnswer(item, ok, wholeCard) {
    if (wholeCard && item.card && item.card.senses && item.card.senses.length) {
      item.card.senses.forEach((sn) => bumpRec(ensureRec(itemKey(item.card, sn, P.level)), ok));
    } else {
      bumpRec(ensureRec(item.key), ok);
    }
    state.seen[item.card.id] = (state.seen[item.card.id] || 0) + 1;
    const d = dailyBucket();
    d.seen += 1;
    if (ok) d.correct += 1; else d.wrong += 1;
    state.log.push({ t: now(), en: item.card.en, cn: item.sense ? item.sense.cn : '', mode: P.mode, level: P.level, ok: !!ok });
    if (state.log.length > 3000) state.log.splice(0, state.log.length - 3000);
  }

  function pruneSrs() {
    const alive = new Set();
    state.cards.forEach((card) => (card.senses || []).forEach((sense) => {
      alive.add(itemKey(card, sense, 'normal'));
      alive.add(itemKey(card, sense, 'hard'));
    }));
    FAMILIES.forEach((f) => alive.add('morph::' + f[0]));
    Object.keys(state.srs).forEach((k) => { if (!alive.has(k)) delete state.srs[k]; });
    const ids = new Set(state.cards.map((c) => c.id));
    Object.keys(state.seen).forEach((k) => { if (!ids.has(k)) delete state.seen[k]; });
  }

    const m = new Map();

  /** 和这些词「沾亲带故」的所有词（共享过任一释义组），出干扰项时避开 */
  function relatedTo(cards) {
    const set = new Set();
    (cards || []).forEach((c) => { if (c) set.add(c.id); });
    Array.from(set).forEach((id) => {
      const c = state.cards.find((x) => x.id === id);
      if (!c) return;
      c.senses.forEach((s) => {
        (P.groupIndex.get(senseKey(s)) || []).forEach((en) => set.add(uid(en)));
      });
    });
    return set;
  }

  function makeSenseQ(item) {
    const card = item.card;
    const seenK = new Set();
    const correct = [];
    const posSet = new Set();
    card.senses.forEach((s) => {
      const k = normCn(s.cn);
      if (!k || seenK.has(k)) return;
      seenK.add(k);
      correct.push({ text: s.cn, ok: true });
      if (posKey(s)) posSet.add(posKey(s));
    });
    const related = relatedTo([card]);
    const same = [];
    const other = [];
    const used = new Set();
    state.cards.forEach((c) => {
      if (related.has(c.id)) return;
      c.senses.forEach((s) => {
        const k = normCn(s.cn);
        if (!k || seenK.has(k) || used.has(k)) return;
        used.add(k);
        const bucket = (posSet.size && posSet.has(posKey(s))) ? same : other;
        bucket.push({ text: s.cn, ok: false });
      });
    });
    shuffle(same); shuffle(other);
    const need = clamp(6 - correct.length, 2, 4);
    const pool = same.concat(other);
    return {
      kind: 'sense', item: item, answer: card.en,
      opts: shuffle(correct.concat(pool.slice(0, need))),
      correctCount: correct.length
    };
  }

  /** 中 → 英：选出所有能表达这个意思的词 */
  function makeSynQ(item) {
    const key = senseKey(item.sense);
    const names = (P.groupIndex.get(key) || []).slice();
    if (!names.length) names.push(item.card.en);
    const correct = [];
    const seenId = new Set();
    names.forEach((en) => {
      const id = uid(en);
      if (seenId.has(id)) return;
      seenId.add(id);
      correct.push({ text: en, ok: true, id: id });
    });
    const related = relatedTo(correct.map((x) => state.cards.find((c) => c.id === x.id)));
    const myPos = posKey(item.sense);
    const same = [];
    const other = [];
    state.cards.forEach((c) => {
      if (related.has(c.id) || !c.senses.length) return;
      const hit = (myPos && c.senses.some((s) => posKey(s) === myPos)) ? same : other;
      hit.push({ text: c.en, ok: false });
    });
    shuffle(same); shuffle(other);
    const need = clamp(6 - correct.length, 2, 4);
    const pool = same.concat(other);
    return {
      kind: 'synonym', item: item, cn: item.sense.cn, pos: item.sense.pos || '',
      opts: shuffle(correct.concat(pool.slice(0, need))),
      correctCount: correct.length
    };
  }

  /** 构词法：base ⇄ derived */
  function morphAvailable() {
    return FAMILIES.filter((f) => {
      const a = state.cards.find((c) => c.id === uid(f[0]));
      const b = state.cards.find((c) => c.id === uid(f[1]));
      return !!(a && b);
    });
  }

  function makeMorphQ(f, dir) {
    const base = f[0];
    const derived = f[1];
    const rule = f[2];
    const card = state.cards.find((c) => c.id === uid(dir === 'derive' ? base : derived))
      || state.cards.find((c) => c.id === uid(base))
      || state.cards.find((c) => c.id === uid(derived));
    if (!card) return null;
    const pool = FAMILIES.filter((x) => x[0] !== base).map((x) => (dir === 'derive' ? x[1] : x[0]));
    shuffle(pool);
    const opts = [{ text: dir === 'derive' ? derived : base, ok: true }]
      .concat(pool.slice(0, 3).map((t) => ({ text: t, ok: false })));
    shuffle(opts);
    return {
      kind: 'morph',
      item: { card: card, sense: { cn: rule, pos: '' }, key: 'morph::' + base, idx: 0 },
      prompt: dir === 'derive' ? base : derived,
      ask: dir === 'derive' ? '它的名词形式是？' : '它是由哪个词变来的？',
      opts: opts,
      correctCount: 1,
      extra: base + ' → ' + derived + '（' + rule + '）'
    };
  }

  function buildMorphQuestions(cap) {
    const list = shuffle(morphAvailable());
    if (!list.length) return [];
    const out = [];
    for (let i = 0; i < cap; i++) {
      const f = list[i % list.length];
      const q = makeMorphQ(f, i % 2 === 0 ? 'derive' : 'base');
      if (q) out.push(q);
    }
    return out;
  }

  /** 这个意思有几个词能表达（≥2 才算「一义多词」） */
  function groupSize(sense) {
    return (P.groupIndex.get(senseKey(sense)) || []).length;
  }

  function buildQuestions(mode, limit, preset) {
    const items = collectItems(P.level);
    P.groupIndex = buildGroupIndex();
    const cap = limit || 20;
    const lv = P.level === 'hard' ? 'hard' : 'normal';

    if (mode === 'morph') return buildMorphQuestions(cap);
    if (mode === 'single') {
      // 一词一义：只有一个意思的词
      let pool = items.filter((it) => it.card.senses.length === 1);
      if (preset && preset.length) pool = preset.filter((it) => it.card.senses.length === 1);
      return sortForReview(pool).slice(0, cap).map((it) => {
        const q = makeSenseQ(it);
        q.level = lv;
        return q;
      });
    }
    if (mode === 'synonym') {
      // 一义多词：只出真正的同义组（≥2 个词），一个词的不算
      let pool = items.filter((it) => normCn(it.sense.cn) && groupSize(it.sense) >= 2);
      if (preset && preset.length) pool = preset.filter((it) => normCn(it.sense.cn) && groupSize(it.sense) >= 2);
      const sorted = sortForReview(pool);
      const out = [];
      const usedG = new Set();
      for (let i = 0; i < sorted.length && out.length < cap; i++) {
        const k = senseKey(sorted[i].sense);
        if (usedG.has(k)) continue;   // 同一个意思只考一次
        usedG.add(k);
        const q = makeSynQ(sorted[i]);
        q.level = lv;
        out.push(q);
      }
      return out;
    }
    // 一词多义：只出两个意思以上的词，且一个词只出一道（取最急的那个意思）
    let src = items.filter((it) => it.card.senses.length >= 2);
    if (preset && preset.length) src = preset.filter((it) => it.card.senses.length >= 2);
    const perCard = new Map();
    const rank = (x) => (!x.rec || !x.rec.seen) ? -1 : (x.rec.due <= now() ? x.rec.box : 100 + x.rec.box);
    src.forEach((it) => {
      const cur = perCard.get(it.card.id);
      if (!cur || rank(it) < rank(cur)) perCard.set(it.card.id, it);
    });
    const pool = Array.from(perCard.values());
    return sortForReview(pool).slice(0, cap).map((it) => {
      const q = makeSenseQ(it);
      q.level = lv;
      return q;
    });
  }

  /* ============ 5. 通用 UI 工具 ============ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let toastTimer = null;
  function toast(msg, kind) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2200);
  }

  function speak(text) {
    if (!global.speechSynthesis || !global.SpeechSynthesisUtterance) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-US';
      u.rate = 0.92;
      const vs = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
      const pick = vs.find((v) => /Samantha|Google US|Aria|Jenny|Zira|Natural/i.test(v.name)) || vs[0];
      if (pick) u.voice = pick;
      speechSynthesis.speak(u);
    } catch (e) { /* 不支持就算了 */ }
  }
  function maybeSpeak(text) { if (state.settings.autoSpeak) speak(text); }

  function normEn(s) {
    return String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, ' ')
      .replace(/^to\s+/, '').replace(/[.。,，;；!?]+$/g, '').trim();
  }

  function diffHtml(typed, answer) {
    const a = normEn(answer), t = normEn(typed);
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const ct = t[i], ca = a[i];
      out += (ct === ca) ? esc(ct) : '<span class="wrong-char">' + esc(ct) + '</span>';
    }
    return out || '<span class="wrong-char">（空）</span>';
  }

  function senseTags(senses, hiIdx) {
    if (!senses || !senses.length) return '<span class="sense-tag" style="color:var(--dim)">（还没有释义）</span>';
    return senses.map((s, i) => (
      '<span class="sense-tag"' + (i === hiIdx ? ' style="border-color:rgba(184,240,142,.55);background:rgba(184,240,142,.1)"' : '') + '>' +
      (s.pos ? '<span class="pos">' + esc(s.pos) + '</span>' : '') + esc(s.cn) + '</span>'
    )).join('');
  }

  /* ============ 6. 视图切换 ============ */
  let currentTab = 'practice';

  function switchTab(name) {
    currentTab = name;
    $$('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    $$('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));

  function updateTabBadge() {
    const items = collectItems(P.level);
    let n = 0;
    items.forEach((it) => {
      if (!it.rec || !it.rec.seen || (it.rec.due <= now() && it.rec.box < BOX_MAX)) n++;
    });

    if (!tab) return;
    const old = tab.querySelector('.dot');

  /* ============ 7. 导入视图 ============ */
  let draft = [];
  let lastParse = null;

  const SAMPLE = [
    '# 一堆乱七八糟的单词，直接粘进来就行',
    'abandon v. 放弃；遗弃；抛弃 /əˈbændən/',
    'desert  n. 沙漠   v. 抛弃，遗弃',

    'compromise n. 妥协  v. 妥协；危及',
    'ambiguous adj. 模棱两可的，含糊不清的',
    'vague adj. 模糊的，含糊的',

  function renderImportMeta() {
    const hint = $('#parse-hint');

    hint.innerHTML = state.cards.length
      ? '词库现有 <b>' + state.cards.length + '</b> 词 / <b>' + items.length + '</b> 条释义'
      : '词库还是空的，先粘一段试试';
  }

  const FORMAT_LABEL = { json: 'JSON', table: '表格行', loose: '原始文本', empty: '空' };

  function doParse() {
    const raw = $('#raw-input').value;
    if (!raw.trim()) { toast('先粘点单词进来', 'err'); return; }
    const res = parseAny(raw);
    if (!res.cards.length) { toast('没认出单词来，检查一下格式', 'err'); return; }
    draft = res.cards;
    lastParse = res;
    const panel = $('#preview-panel');
    panel.hidden = false;
    const pf = $('#preview-format');
    if (pf) pf.textContent = '识别为 ' + (FORMAT_LABEL[res.format] || '自动');
    renderDraft();
    const words = draft.length;
    const senses = draft.reduce((n, c) => n + c.senses.length, 0);
    toast('整理完成：' + words + ' 词 / ' + senses + ' 条释义 · ' + (FORMAT_LABEL[res.format] || ''), 'ok');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function sensesToText(senses) {
    return (senses || []).map((s) => (s.pos ? s.pos + ' ' : '') + s.cn).join('\n');
  }
  function textToSenses(text) {
    return String(text || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
      const m = l.match(/^([a-z]+\.)\s*(.+)$/i);
      return m ? { pos: m[1].toLowerCase(), cn: m[2].trim() } : { pos: '', cn: l };
    }).filter((s) => s.cn);
  }

  function renderDraft() {
    const box = $('#draft-list');
    if (!box) return;
    box.innerHTML = draft.map((c, i) => {
      const bad = !c.senses.length ? ' bad-row' : '';
      const ex = c.examples && c.examples[0] ? c.examples[0] : null;
      const rows = Math.max(2, c.senses.length);
      return '<div class="draft-row' + bad + '" data-i="' + i + '">' +
        '<div class="dr-main">' +
        '<input type="text" class="in-en" data-f="en" value="' + esc(c.en) + '" placeholder="单词">' +
        '<input type="text" class="in-ph" data-f="phonetic" value="' + esc(c.phonetic) + '" placeholder="音标（可选）">' +
        '</div>' +
        '<textarea class="in-sense" data-f="senses" rows="' + rows + '" placeholder="每行一个释义，可带 v. n.">' + esc(sensesToText(c.senses)) + '</textarea>' +
        '<button class="icon-btn del" data-f="del" title="删除">✕</button>' +
        '<input type="text" class="in-ex" data-f="example" value="' + esc(ex ? ex.en + (ex.cn ? ' - ' + ex.cn : '') : '') + '" placeholder="例句（可选）">' +
        (c.note ? '<div class="dr-note">📎 ' + esc(c.note) + '</div>' : '') +
        '</div>';
    }).join('');
    updatePreviewSummary();
  }

  function updatePreviewSummary() {
    const senses = draft.reduce((n, c) => n + c.senses.length, 0);
    const pc = $('#preview-count');
    if (pc) pc.textContent = draft.length + ' 词 / ' + senses + ' 释义';
    const groups = buildGroups(draft);
    const gp = $('#group-preview');
    if (gp) {
      gp.innerHTML = groups.length
        ? groups.slice(0, 14).map((g) => '<span class="group-chip"><b>' + esc(g.cn) + '</b> ← ' + esc(g.members.map((m) => m.en).join(' / ')) + '</span>').join('')
        : '<span class="group-chip">暂未发现同义组（多个单词共享同一个中文释义时会自动成组）</span>';
    }
    const il = $('#issue-list');
    if (il) {
      const issues = (lastParse && lastParse.issues) ? lastParse.issues : [];
      il.innerHTML = issues.slice(0, 8).map((it) =>
        '<div class="issue">' + (it.line ? '第 ' + it.line + ' 行：' : '') + esc(it.why) + ' — <b>' + esc(it.text.slice(0, 46)) + '</b></div>'
      ).join('');
    }
  }

  function bindImport() {
    const raw = $('#raw-input');
    $('#btn-sample').onclick = () => { raw.value = SAMPLE; raw.focus(); toast('示例已填入，点「整理一下」'); };
    $('#btn-clear-input').onclick = () => { raw.value = ''; raw.focus(); };
    $('#btn-parse').onclick = doParse;
    $('#btn-file').onclick = () => $('#file-import').click();
    $('#file-import').onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { raw.value = String(rd.result || ''); doParse(); };
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
    };
    raw.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doParse(); }
    });

    const dl = $('#draft-list');
    dl.addEventListener('input', (e) => {
      const row = e.target.closest('.draft-row');
      if (!row) return;
      const i = +row.dataset.i;
      const f = e.target.dataset.f;
      const card = draft[i];
      if (!card) return;
      if (f === 'en') { card.en = e.target.value; card.id = uid(card.en); }
      else if (f === 'phonetic') card.phonetic = e.target.value;
      else if (f === 'senses') card.senses = textToSenses(e.target.value);
      else if (f === 'example') {
        card.examples = e.target.value.trim() ? [parseExample(e.target.value)] : [];
      }
    });
    dl.addEventListener('change', (e) => {
      const row = e.target.closest('.draft-row');
      if (row && e.target.dataset.f === 'senses') {
        row.classList.toggle('bad-row', !draft[+row.dataset.i].senses.length);
        updatePreviewSummary();
      }
    });
    dl.addEventListener('click', (e) => {
      const del = e.target.closest('[data-f="del"]');
      if (del) {
        const row = del.closest('.draft-row');
        draft.splice(+row.dataset.i, 1);
        renderDraft();
      }
    });

    $('#btn-sort-draft').onclick = () => {
      draft.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));
      renderDraft();
    };
    $('#btn-drop-empty').onclick = () => {
      const before = draft.length;
      draft = draft.filter((c) => c.senses.length);
      renderDraft();
      toast('删掉 ' + (before - draft.length) + ' 个没释义的条目');
    };
    $('#btn-discard').onclick = () => { draft = []; lastParse = null; $('#preview-panel').hidden = true; };
    $('#btn-import').onclick = importDraft;
  }

  function importDraft() {
    if (!draft.length) { toast('没有可导入的内容', 'err'); return; }
    let words = 0, senses = 0;
    draft.forEach((c) => {
      if (!c.en.trim()) return;
      const before = state.cards.length;
      const card = upsertCard(state.cards, c.en.trim(), c.senses, { phonetic: c.phonetic, note: c.note });
      if (!card) return;
      if (state.cards.length > before) words++;
      senses += c.senses.length;
      if (c.examples && c.examples.length) {
        c.examples.forEach((ex) => {
          if (ex.en && card.examples.length < 8 && !card.examples.some((x) => x.en === ex.en)) card.examples.push(ex);
        });
      }
    });
    const d = dailyBucket();
    d.words += words;
    pruneSrs();
    saveState();
    draft = [];
    lastParse = null;
    $('#preview-panel').hidden = true;
    $('#raw-input').value = '';
    toast('已导入 ' + words + ' 个新词，共 ' + senses + ' 条释义', 'ok');
    renderImportMeta();
    updateTabBadge();
    switchTab('library');
  }

  /* ============ 8. 词库视图 ============ */
  let libEditing = new Set();
  let libFilter = 'all';
  let libSort = 'added';

  function cardStats(card) {
    let right = 0, wrong = 0, mastered = 0, due = 0, seen = 0;
    (card.senses || []).forEach((s) => {
      const rec = bestRec(state.srs[itemKey(card, s, 'normal')], state.srs[itemKey(card, s, 'hard')]);
      if (!rec) return;
      right += rec.right || 0;
      wrong += rec.wrong || 0;
      seen += rec.seen || 0;
      if (rec.box >= 4) mastered++;
      if (rec.due <= now() && rec.box < BOX_MAX) due++;
    });
    return { right: right, wrong: wrong, mastered: mastered, due: due, seen: seen, total: (card.senses || []).length };
  }

  function cardStatus(card) {
    const st = cardStats(card);
    if (!st.total) return { label: '缺释义', cls: 'bad' };
    if (st.mastered >= st.total) return { label: '已掌握', cls: 'accent' };
    if (st.wrong > 0 && st.wrong >= st.right) return { label: '薄弱', cls: 'warn' };
    if (st.seen === 0) return { label: '新词', cls: '' };
    return { label: '在练 ' + st.mastered + '/' + st.total, cls: '' };
  }

  function renderLibrary() {
    const searchEl = $('#lib-search');
    const q = ((searchEl && searchEl.value) || '').toLowerCase().trim();
    const filter = libFilter;
    const sort = libSort;

    let list = state.cards.slice();
    if (q) {
      list = list.filter((c) =>
        c.en.toLowerCase().includes(q) ||
        (c.senses || []).some((s) => s.cn.toLowerCase().includes(q)) ||
        (c.examples || []).some((e) => e.en.toLowerCase().includes(q))
      );
    }
    if (filter === 'new') list = list.filter((c) => cardStats(c).seen === 0);
    else if (filter === 'weak') { list = list.filter((c) => { const st = cardStats(c); return st.wrong > 0 && st.right <= st.wrong; }); }
    else if (filter === 'mastered') list = list.filter((c) => { const st = cardStats(c); return st.total > 0 && st.mastered >= st.total; });
    else if (filter === 'nosure') list = list.filter((c) => !c.senses.length);

    if (sort === 'alpha') list.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));
    else if (sort === 'bad') list.sort((a, b) => cardStats(b).wrong - cardStats(a).wrong);
    else if (sort === 'due') list.sort((a, b) => cardStats(b).due - cardStats(a).due);

    const groups = buildGroups(state.cards);
    const gmap = new Map();
    groups.forEach((g) => g.members.forEach((m) => {
      if (!gmap.has(m.id)) gmap.set(m.id, []);
      gmap.get(m.id).push(g);
    }));

    $('#lib-count').textContent = '显示 ' + list.length + ' / ' + state.cards.length + ' 词';

    const wrap = $('#lib-list');
    if (!list.length) {
      wrap.innerHTML = '<div class="panel"><div class="empty"><div class="big">📭</div>' +
        (state.cards.length ? '这个筛选下没有单词' : '词库还是空的，去「导入」粘一批进来吧') + '</div></div>';
      return;
    }

    wrap.innerHTML = list.map((c) => {
      const st = cardStats(c);
      const status = cardStatus(c);
      const editing = libEditing.has(c.id);
      const gs = (gmap.get(c.id) || []).slice(0, 3);
      const seen = state.seen[c.id] || 0;
      return '<div class="lib-item" data-id="' + esc(c.id) + '">' +
        '<div class="lib-head">' +
        '<span class="lib-word">' + esc(c.en) + '</span>' +
        (c.phonetic ? '<span class="lib-phon">/' + esc(c.phonetic.replace(/^\/|\/$/g, '')) + '/</span>' : '') +
        '<button class="speak" data-act="say" title="发音">🔊</button>' +
        '<span class="badge ' + status.cls + '">' + esc(status.label) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="icon-btn" data-act="edit" title="编辑">✎</button>' +
        '</div>' +
        '<div class="lib-senses">' + senseTags(c.senses, -1) + '</div>' +
        (c.examples && c.examples[0] ? '<div class="sub" style="margin-top:8px">例：<i style="font-family:var(--serif)">' + esc(c.examples[0].en) + '</i>' + (c.examples[0].cn ? ' — ' + esc(c.examples[0].cn) : '') + '</div>' : '') +
        (c.note ? '<div class="sub" style="margin-top:6px;color:#9fb0c0">📎 ' + esc(c.note) + '</div>' : '') +
        '<div class="lib-meta">' +
        '<span>见过的次数 ' + seen + '</span>' +

        (gs.length ? gs.map((g) => '<span>同义「' + esc(g.cn) + '」：' + esc(g.members.filter((m) => m.id !== c.id).map((m) => m.en).join(', ')) + '</span>').join('') : '') +
        '</div>' +
        (editing ? editForm(c) : '') +
        '</div>';
    }).join('');
  }

  function finalizeCardEdit(card) {
    const newId = uid(card.en);
    if (!newId) return;
    if (newId !== card.id) {
      const dup = state.cards.find((c) => c !== card && c.id === newId);
      if (dup) {
        (card.senses || []).forEach((s) => {
          if (!dup.senses.some((x) => normCn(x.cn) === normCn(s.cn))) dup.senses.push(s);
        });
        (card.examples || []).forEach((ex) => {
          if (!dup.examples.some((x) => x.en === ex.en)) dup.examples.push(ex);
        });
        state.cards = state.cards.filter((c) => c !== card);
        libEditing.delete(card.id);
      } else {
        libEditing.delete(card.id);
        card.id = newId;
        libEditing.add(newId);
      }
    }
    pruneSrs();
    saveState();
  }

  function editForm(c) {
    return '<div class="lib-edit">' +
      '<div class="row gap">' +
      '<input data-f="en" value="' + esc(c.en) + '" placeholder="单词" style="flex:1">' +
      '<input data-f="phonetic" value="' + esc(c.phonetic) + '" placeholder="音标" style="max-width:170px">' +
      '</div>' +
      '<textarea data-f="senses" rows="' + Math.max(3, c.senses.length) + '" placeholder="每行一个释义">' + esc(sensesToText(c.senses)) + '</textarea>' +
      '<input data-f="example" value="' + esc(c.examples && c.examples[0] ? c.examples[0].en + (c.examples[0].cn ? ' - ' + c.examples[0].cn : '') : '') + '" placeholder="例句（可选）">' +
      '<div class="row gap"><button class="btn sm primary" data-act="edit-done">完成</button>' +
      '<button class="btn sm danger-ghost" data-act="del">删除这个词</button></div>' +
      '</div>';
  }

  function bindLibrary() {
    const search = $('#lib-search');
    if (search) search.addEventListener('input', renderLibrary);

    const fseg = $('#lib-filter-seg');
    if (fseg) {
      fseg.addEventListener('click', (e) => {
        const b = e.target.closest('.seg-btn');
        if (!b) return;
        libFilter = b.dataset.f;
        fseg.querySelectorAll('.seg-btn').forEach((x) => x.classList.toggle('on', x === b));
        renderLibrary();
      });
    }
    const sseg = $('#lib-sort-seg');
    if (sseg) {
      sseg.addEventListener('click', (e) => {
        const b = e.target.closest('.seg-btn');
        if (!b) return;
        libSort = b.dataset.s;
        sseg.querySelectorAll('.seg-btn').forEach((x) => x.classList.toggle('on', x === b));
        renderLibrary();
      });
    }

    const wrap = $('#lib-list');
    wrap.addEventListener('input', (e) => {
      const item = e.target.closest('.lib-item');
      if (!item || !e.target.dataset.f) return;
      const card = state.cards.find((c) => c.id === item.dataset.id);
      if (!card) return;
      const f = e.target.dataset.f;
      if (f === 'en') card.en = e.target.value;
      else if (f === 'phonetic') card.phonetic = e.target.value;
      else if (f === 'senses') card.senses = textToSenses(e.target.value);
      else if (f === 'example') card.examples = e.target.value.trim() ? [parseExample(e.target.value)] : [];
    });
    wrap.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      const item = act.closest('.lib-item');
      if (!item) return;
      const id = item.dataset.id;
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      const a = act.dataset.act;
      if (a === 'say') { speak(card.en); return; }
      if (a === 'edit') {
        if (libEditing.has(id)) libEditing.delete(id); else libEditing.add(id);
        renderLibrary();
        return;
      }
      if (a === 'edit-done') {
        finalizeCardEdit(card);
        renderLibrary();
        updateTabBadge();
        toast('已保存');
        return;
      }
      if (a === 'del') {
        if (!confirm('删除「' + card.en + '」？')) return;
        state.cards = state.cards.filter((c) => c.id !== id);
        libEditing.delete(id);
        pruneSrs();
        saveState();
        renderLibrary();
        updateTabBadge();
        toast('已删除');
      }
    });

    const expBtn = $('#btn-export');
    if (expBtn) expBtn.onclick = exportJSON;
    const impBtn = $('#btn-import-json');
    if (impBtn) impBtn.onclick = () => { const f = $('#file-json'); if (f) f.click(); };
    const fj = $('#file-json');
    if (fj) fj.onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          const cards = Array.isArray(data.cards) ? data.cards : [];
          if (!cards.length) throw new Error('没有 cards');
          cards.forEach((c) => {
            if (!c.en) return;
            upsertCard(state.cards, c.en, c.senses || [], { phonetic: c.phonetic });
          });
          if (data.srs) Object.assign(state.srs, data.srs);
          pruneSrs();
          saveState();
          renderLibrary();
          toast('导入成功，现在共 ' + state.cards.length + ' 词', 'ok');
        } catch (err) { toast('文件解析失败：' + err.message, 'err'); }
      };
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
    };
  }

  function exportJSON() {
    const payload = { app: 'wordforge', version: 1, exportedAt: new Date().toISOString(), cards: state.cards, srs: state.srs, seen: state.seen, daily: state.daily };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'word-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已导出 JSON', 'ok');
  }

  /* ============ 9. 练习视图 ============ */

  function runShellHtml() {
