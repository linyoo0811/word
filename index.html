  function renderPractice() {
    const body = $('#practice-body');
    if (!body) return;
    if (P.phase === 'setup') body.innerHTML = setupHtml();
    else if (P.phase === 'run') { body.innerHTML = runShellHtml(); renderStage(); }
    else body.innerHTML = summaryHtml();
    bindPractice();
  }

  function bindPractice() {
    const body = $('#practice-body');
    body.onclick = (e) => {
      const go = e.target.closest('[data-go]');
      if (go) { switchTab(go.dataset.go); return; }
      const lv = e.target.closest('[data-lv]');
      if (lv) {
        P.level = lv.dataset.lv === 'hard' ? 'hard' : 'normal';
        state.settings.level = P.level;
        saveState();
        renderPractice();
        return;
      }
      const sb = e.target.closest('.seg-btn[data-n]');
      if (sb) {
        P.limit = +sb.dataset.n;
        state.settings.limit = P.limit;
        saveState();
        $$('#limit-seg .seg-btn').forEach((b) => b.classList.toggle('on', b === sb));
        return;
      }
      const mc = e.target.closest('.mode-card') || e.target.closest('.mode-pill');
      if (mc && mc.dataset.mode && !mc.classList.contains('disabled')) {
        P.mode = mc.dataset.mode;
        state.settings.mode = P.mode;
        saveState();
        renderPractice();
        return;
      }
      if (e.target.closest('#btn-start')) { startSession(P.mode); return; }
      if (e.target.closest('#btn-quit')) { flushTime(); P.phase = 'setup'; renderPractice(); return; }
      if (e.target.closest('#btn-again')) { startSession(P.mode); return; }
      if (e.target.closest('#btn-home')) { P.phase = 'setup'; renderPractice(); return; }
      if (e.target.closest('#btn-retry-wrong')) { retryWrong(); return; }
    };
    body.onchange = (e) => {
      if (e.target.id === 'auto-speak') { state.settings.autoSpeak = e.target.checked; saveState(); }
    };
  }

  function startSession(mode, presetItems) {
    flushTime();
    const qs = buildQuestions(mode, P.limit, presetItems);
    if (!qs.length) { toast('这个模式暂时没有可练的内容', 'err'); return; }
    P.phase = 'run';
    P.mode = mode;
    state.settings.mode = mode;
    P.qs = qs;
    P.cur = 0;
    P.answered = 0;
    P.correct = 0;
    P.wrong = 0;
    P.streak = 0;
    P.tries = 0;
    P.wrongItems = [];
    P.startedAt = now();
    P.revealed = false;
    saveState();
    renderPractice();
  }

  function currentQ() { return P.qs[P.cur] || null; }

  function updateProgress() {
    const total = Math.max(P.qs.length, 1);
    const bar = $('#run-bar');
    if (bar) bar.style.width = Math.round((P.answered / total) * 100) + '%';
    const counter = $('#run-counter');
    if (counter) counter.textContent = Math.min(P.cur + 1, total) + ' / ' + total;
  }

  function renderStage() {
    const stage = $('#stage');
    if (!stage) return;
    const q = currentQ();
    if (!q) { finishSession(); return; }
    P.tries = 0;
    P.revealed = !!q.done;
    updateProgress();

    stage.innerHTML = questionHtml(q);
    bindStage(q);

    if (q.done) {
      paintAnswered(q, false);
      return;
    }
    if (q.kind === 'sense' && state.settings.autoSpeak) {
      setTimeout(() => speak(q.answer), 150);
    }
  }

  function advance() {
    if (now() < (P.nextReadyAt || 0)) return;
    P.cur += 1;
    if (P.cur >= P.qs.length) { finishSession(); return; }
    renderStage();
  }

  function finishSession() {
    P.lastMins = Math.max(1, Math.round((now() - P.startedAt) / 60000));
    flushTime();
    P.phase = 'done';
    renderPractice();
    updateTabBadge();
    saveState();
  }

  function summaryHtml() {
    const total = P.correct + P.wrong;
    const acc = total ? Math.round((P.correct / total) * 100) : 0;
    const mins = P.lastMins || 1;
    const uniq = [];
    const seen = new Set();
    P.wrongItems.forEach((it) => { if (!seen.has(it.key)) { seen.add(it.key); uniq.push(it); } });
    return '<div class="panel">' +
      '<div class="panel-head"><h2>这一轮结束了</h2><p>' + (MODES.find((m) => m.id === P.mode) || {}).name + ' · 用时约 ' + mins + ' 分钟</p></div>' +
      '<div class="sum-grid">' +
      '<div class="stat"><b>' + total + '</b><span>答题数</span></div>' +
      '<div class="stat hi"><b>' + P.correct + '</b><span>答对</span></div>' +
      '<div class="stat ' + (P.wrong ? 'warn' : '') + '"><b>' + P.wrong + '</b><span>答错</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>正确率</span></div>' +
      '</div>' +
      (uniq.length
        ? '<div class="hr"></div><div class="sub">这轮错的 ' + uniq.length + ' 个：</div><div class="wrong-list">' +
        uniq.map((it) => '<span class="chip" data-say="' + esc(it.card.en) + '">' + esc(it.card.en) + (it.sense ? ' · ' + esc(it.sense.cn) : '') + '</span>').join('') +

      '<button class="btn primary" id="btn-again">再来一轮</button>' +

  function retryWrong() {
    const items = [];
    const seen = new Set();
    P.wrongItems.forEach((it) => { if (!seen.has(it.key)) { seen.add(it.key); items.push(it); } });
    if (!items.length) { toast('没有错题'); return; }
    P.limit = Math.max(items.length, 5);
    startSession(P.mode, items);
  }

  /* ---------- 各题型渲染 ---------- */

  function optsInner(q) {

    ).join('');

  function slotsInner(q) {
    const en = (q.kind === 'synonym' || q.kind === 'morph');
    const inputs = q.slots.map((v, i) =>
      '<input class="slot-input' + (en ? ' en' : '') + '" data-slot="' + i + '"' +

      ' autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' +

    return inputs + add;

  function questionHtml(q) {
    const en = (q.kind === 'synonym' || q.kind === 'morph');
    let body;
    if (q.level === 'hard') {
      if (!Array.isArray(q.slots) || !q.slots.length) q.slots = [''];
      body = '<div class="slots" id="slots">' + slotsInner(q) + '</div>' +
        '<div class="spell-hint" id="spell-hint" hidden></div>';
    } else {
      q.picked = q.picked || new Set();
      body = '<div class="options' + (en ? ' en' : '') + '" id="opts"></div>';
    }
    return questionHead(q) + body + barHtml();
  }

  /** 英文答案归一化 */
  function normEnAnswer(s) {
    return String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, ' ')
      .replace(/^to\s+/, '').replace(/[.。,，;；!?]+$/g, '').trim();
  }

  /** 打字答案 → 和正确答案池匹配 */
  function matchAnswer(raw, bank, usedSet, isEn) {
    const t = isEn ? normEnAnswer(raw) : normCn(raw);
    if (!t) return -1;
    for (let i = 0; i < bank.length; i++) {
      if (usedSet.has(i)) continue;
      const b = isEn ? normEnAnswer(bank[i]) : normCn(bank[i]);
      if (!b) continue;
      if (t === b) return i;
      if (!isEn && t.length >= 2 && (b.indexOf(t) >= 0 || t.indexOf(b) >= 0)) return i;
    }
    return -1;
  }

  /** 判一次打字：只比非空的框 */
  /** 判一次打字：拼写近似但确实是手滑的 → 算对；多余的不扣分 */
  function gradeTyped(q) {
    const isEn = (q.kind === 'synonym' || q.kind === 'morph');
    const bank = q.opts.filter((o) => o.ok).map((o) => o.text);
    const used = new Set();
    const fixes = [];

    const results = q.slots.map((raw) => {
      const v = String(raw || '').trim();
      if (!v) return { state: 'empty', bankIdx: -1 };
      const idx = matchAnswer(v, bank, used, isEn);
      if (idx >= 0) { used.add(idx); return { state: 'ok', bankIdx: idx, fixed: '' }; }
      // 手滑容错：差一两个字母，且打出来的不是别的真词
      if (isEn) {
        const sug = suggestSpelling(v, bank.filter((_, i) => !used.has(i)));
        if (sug) {
          const j = bank.indexOf(sug);
          if (j >= 0 && !used.has(j)) {
            used.add(j);
            fixes.push(sug);
            return { state: 'ok', bankIdx: j, fixed: sug };
          }
        }
      }
      return { state: 'extra', bankIdx: -1 };
    });

    const missed = bank.length - used.size;
    const ok = missed === 0 && used.size > 0;
    return { bank: bank, results: results, matched: used.size, missed: missed, ok: ok, fixes: fixes };
  }

  /** Damerau-Levenshtein：允许漏字、多字、错字、相邻换位 */
  function editDist(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 9;
    const d = [];
    for (let i = 0; i <= m; i++) { d[i] = [i]; }
    for (let j = 0; j <= n; j++) { d[0][j] = j; }
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const c = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
          d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
        }
      }
    }
    return d[m][n];
  }

  let knownWords = null;
  function isKnownWord(w) {
    if (!knownWords || knownWords.size !== state.cards.length) {
      knownWords = new Set(state.cards.map((c) => c.id));
    }
    return knownWords.has(uid(w));
  }

  /** 只纠「像手滑」的；打出来本身是别的真词就不纠 */
  function suggestSpelling(raw, bank) {
    const t = normEnAnswer(raw);
    if (t.length < 3) return null;
    if (/[^a-z' -]/.test(t)) return null;
    if (bank.some((b) => normEnAnswer(b) === t)) return null;
    if (isKnownWord(t)) return null;
    let best = null;
    let bestD = 9;
    bank.forEach((b) => {
      const bb = normEnAnswer(b);
      if (!bb) return;
      // 漏拼最多 1 个字母；拼错 / 打反 / 多打，合计最多 2 处
      const missing = Math.max(0, bb.length - t.length);
      if (missing > 1) return;
      const dd = editDist(t, bb);
      if (dd <= 2 && dd < bestD) { bestD = dd; best = b; }
    });
    return best;
  }

  /** 判完之后：把纠对的词写回框里，并在下面列出「猜你想拼」 */
  function applyFixes(q) {
    const g = q.graded;
    if (!g) return;
    const inputs = $$('#slots .slot-input');
    g.results.forEach((r, i) => {
      if (r.fixed && inputs[i]) {
        inputs[i].value = r.fixed;
        q.slots[i] = r.fixed;
      }
    });
    const el = document.getElementById('spell-hint');
    if (!el) return;
    if (!g.fixes || !g.fixes.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = g.fixes.map((w) =>
      '<span class="sh-label">猜你想拼</span><span class="sh-word">' + esc(w) + '</span>'
    ).join('');
  }

  function renderSlots(q) {
    const box = $('#slots');
    if (box) box.innerHTML = slotsInner(q);
    const inputs = $$('#slots .slot-input');
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        q.slots[i] = inp.value;
        inp.classList.remove('bad', 'extra');
        const el = document.getElementById('spell-hint');
        if (el) { el.hidden = true; el.innerHTML = ''; }
      });
      // 点红框：清空重打；绿框不给动
      inp.addEventListener('focus', () => {
        if (q.locked || inp.classList.contains('ok')) inp.blur();
      });
      inp.addEventListener('pointerdown', () => {
        if (q.locked || inp.classList.contains('ok')) return;
        if (inp.value.trim()) {
          inp.value = '';
          q.slots[i] = '';
          inp.classList.remove('bad', 'extra');
        }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.isComposing) return;
        e.preventDefault();
        if (q.done) {
          if (q.redo) {
            // 写错了：Enter 回到第一个错的框
            const bad = $('#slots .slot-input').filter((x) => x.classList.contains('bad'));
            const first = bad[0] || $('#slots .slot-input')[0];
            if (first) {
              first.focus();
              first.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
            return;
          }
          submitOrAdvance(q);   // 全对：Enter = 下一题
          return;
        }
        // 还在答：框数没到答案数 → 再加一个；到数了 → 提交
        if (q.slots.length >= q.correctCount) { checkQuestion(q); return; }
        newSlot(q);
      });
    });
  }

  function newSlot(q) {
    if (q.locked) return;
    q.slots.push('');
    renderSlots(q);
    const inputs = $$('#slots .slot-input');
    const last = inputs[inputs.length - 1];
    if (last) { try { last.focus(); } catch (e) {} }
  }

  function bindStage(q) {
    const prev = $('#btn-prev');
    if (prev) prev.onclick = () => goPrev();

    if (q.level === 'hard') {
      renderSlots(q);

      const slotBox = $('#slots');
      if (slotBox) {
        slotBox.addEventListener('click', (e) => {
          if (e.target.closest('#add-slot')) { e.preventDefault(); newSlot(q); }
        });
      }
      const inputs = $('#slots .slot-input');
      if (inputs[0] && !q.locked) setTimeout(() => { try { inputs[0].focus(); } catch (e) {} }, 60);
    } else {
      const opts = $('#opts');
      if (opts) {
        opts.innerHTML = optsInner(q);
        opts.addEventListener('click', (e) => {
          const b = e.target.closest('.option');
          if (!b || P.revealed) return;
          const i = +b.dataset.i;
          if (q.picked.has(i)) q.picked.delete(i); else q.picked.add(i);
          b.classList.toggle('picked', q.picked.has(i));
          const m = b.querySelector('.mark');
          if (m) m.textContent = q.picked.has(i) ? '✓' : '';
        });
      }
    }
    const ck = $('#btn-check');
    if (ck) ck.onclick = () => submitOrAdvance(q);
  }

  function submitOrAdvance(q) {
    if (q.level === 'hard' && q.redo) { checkRedo(q); return; }
    if (q.done) { advance(); return; }
    checkQuestion(q);
  }

  function goPrev() {
    if (P.cur <= 0) return;
    P.nextReadyAt = 0;
    P.cur -= 1;
    renderStage();
  }

  function paintAnswered(q, speakOn) {
    const hard = q.level === 'hard';
    const isSyn = q.kind === 'synonym';
    const card = q.item.card;
    const g = q.graded || { bank: [], missed: 0, matched: 0, results: [] };

    if (hard) {
      const inputs = $$('#slots .slot-input');
      inputs.forEach((inp, i) => {
        const r = g.results[i];
        inp.classList.remove('ok', 'bad', 'extra');
        if (!r) return;
        if (r.state === 'ok') {
          inp.classList.add('ok');
          inp.readOnly = true;
          inp.tabIndex = -1;
          if (document.activeElement === inp) inp.blur();
        }
        else if (r.state === 'extra' && String(q.slots[i] || '').trim()) inp.classList.add(q.okResult ? 'extra' : 'bad');
        else if (r.state === 'empty' && !q.okResult) inp.classList.add('bad');
        if (q.locked) { inp.readOnly = true; inp.tabIndex = -1; }
      });
      applyFixes(q);
    } else {
      const opts = $('#opts');
      if (opts) {
        Array.from(opts.children).forEach((el, i) => {
          const o = q.opts[i];
          const mark = el.querySelector('.mark');
          el.classList.remove('picked');
          if (o.ok && q.picked.has(i)) { el.classList.add('ok'); if (mark) mark.textContent = '✓'; }
          else if (o.ok && !q.picked.has(i)) { el.classList.add('missed'); if (mark) mark.textContent = '漏'; }
          else if (!o.ok && q.picked.has(i)) { el.classList.add('bad'); if (mark) mark.textContent = '✗'; }
          else if (mark) mark.textContent = '';
        });
      }
    }

    const vd = $('#verdict');
    if (vd) {
      vd.className = 'vline ' + (q.okResult ? 'good' : 'bad');
      vd.textContent = (q.okResult ? '✓ ' : '✗ ') + g.matched + ' / ' + g.bank.length;
    }

    const btn = $('#btn-check');
    if (btn) {
      btn.disabled = false;
      btn.className = 'btn primary';
      if (q.redo) {
        btn.innerHTML = '再打一遍 <span class="kb">Enter</span>';
        btn.onclick = () => checkRedo(q);
      } else {
        btn.innerHTML = '下一个 <span class="kb">Enter</span>';
        btn.onclick = () => advance();
      }
    }

    const actions = $('#actions');
    if (actions) {
      // 先清掉上一次画的（重打时会再画一次）
      document.querySelectorAll('.count-answer, .answer-extra').forEach((n) => n.remove());
      const extra = [];
      if (q.kind === 'morph' && q.extra) extra.push(esc(q.extra));
      if (card.note && q.kind !== 'morph') extra.push('📎 ' + esc(card.note));
      if (extra.length) {
        const box = document.createElement('div');
        box.className = 'answer-extra';
        box.innerHTML = extra.map((x) => '<div>' + x + '</div>').join('');
        actions.insertAdjacentElement('afterend', box);
      }
      if (hard) {
        const matched = new Set();
        (g.results || []).forEach((r) => { if (r.state === 'ok' && r.bankIdx >= 0) matched.add(r.bankIdx); });
        const box = document.createElement('div');
        box.className = 'count-answer';
        box.innerHTML = '<div class="ca-list">' + g.bank.map((t, i) =>
          '<span class="sense-tag ' + (matched.has(i) ? 'ok' : 'bad') + '">' + esc(t) + '</span>'
        ).join('') + '</div>';
        actions.insertAdjacentElement('afterend', box);
      }
    }
    P.nextReadyAt = now() + 260;
    if (speakOn && !isSyn && q.answer) speak(q.answer);
  }

  /* ---------- 判题 ---------- */
  function checkQuestion(q) {
    if (P.revealed) return;

    if (q.level === 'hard') {
      const g = gradeTyped(q);
      q.graded = g;
      q.done = true;
      q.okResult = g.ok;
      P.revealed = true;
      recordAnswer(q.item, g.ok, q.kind === 'sense' || q.kind === 'single');
      P.answered += 1;
      if (g.ok) {
        P.correct += 1; P.streak += 1; P.best = Math.max(P.best, P.streak);
      } else {
        P.wrong += 1; P.streak = 0; P.wrongItems.push(q.item);
        q.redo = true;
      }
      q.streakAt = P.streak;
      updateProgress();
      saveState();
      paintAnswered(q, true);
      if (q.redo) {
        const first = $('#slots .slot-input');
        if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 60);
      }
      return;
    }

    let all = true;
    let got = 0;
    q.opts.forEach((o, i) => {
      const hit = !!(q.picked && q.picked.has(i));
      if (!!o.ok !== hit) all = false;
      if (o.ok && hit) got += 1;
    });
    const bank = q.opts.filter((o) => o.ok).length;
    q.graded = { bank: q.opts.filter((o) => o.ok).map((o) => o.text), matched: got, missed: bank - got, results: [] };
    q.done = true;
    q.okResult = all;
    P.revealed = true;
    recordAnswer(q.item, all, q.kind === 'sense' || q.kind === 'single');
    P.answered += 1;
    if (all) {
      P.correct += 1; P.streak += 1; P.best = Math.max(P.best, P.streak);
    } else {
      P.wrong += 1; P.streak = 0; P.wrongItems.push(q.item);
      if (!q.retry) {
        P.qs.push(Object.assign({}, q, {
          retry: true, slots: null, picked: null, graded: null, done: false, okResult: null, locked: false,
          opts: q.opts.map((o) => Object.assign({}, o))
        }));
      }
    }
    q.streakAt = P.streak;
    updateProgress();
    saveState();
    paintAnswered(q, true);
  }

  /** 错题照着再打：必须全对才放行，次数不限 */
  function checkRedo(q) {
    const g = gradeTyped(q);
    q.graded = g;
    if (g.ok) {
      q.redo = false;
      q.locked = true;
      q.okResult = true;
      q.slots = g.results.map((r, i) => (r.state === 'ok' ? (q.slots[i] || '') : q.slots[i] || ''));
      paintAnswered(q, false);
      const btn = $('#btn-check');
      if (btn) { btn.innerHTML = '下一个 <span class="kb">Enter</span>'; btn.onclick = () => advance(); }
      const panel = document.querySelector('.count-answer .ca-note');
      if (panel) panel.remove();
      return;
    }
    paintAnswered(q, false);
    const box = $('#slots');
    if (box) { box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 320); }
  }


  /* ---------- 键盘 ---------- */
  function onKeydown(e) {
    if (P.phase !== 'run') return;
    if (e.defaultPrevented) return;
    if (e.key === 'Enter' && !e.isComposing) {
      const ck = document.querySelector('#btn-check');
      if (ck && !ck.disabled) { e.preventDefault(); ck.click(); }
      return;
    }
    if (e.key === 'Escape') { flushTime(); P.phase = 'setup'; renderPractice(); }
  }

  /* ============ 10. 统计视图 ============ */
  function renderStats() {
    const items = collectItems();
    const total = state.cards.length;
    const senses = items.length;
    const mastered = items.filter((it) => it.best && it.best.box >= 4).length;
    const due = items.filter((it) => it.best && it.best.seen && it.best.due <= now() && it.best.box < BOX_MAX).length;
    const today = state.daily[todayKey()] || { seen: 0, correct: 0, wrong: 0, words: 0 };
    const accToday = (today.correct + today.wrong) ? Math.round((today.correct * 100) / (today.correct + today.wrong)) : 0;

    // 7 天：答题次数 + 学习时长
    const days = [];
    const mins = [];
    for (let i = 6; i >= 0; i--) {
      const t = now() - i * DAY;
      const k = todayKey(t);
      const b = state.daily[k] || { seen: 0 };
      days.push({ k: k, label: k.slice(5), n: b.seen || 0 });
      mins.push({ k: k, label: k.slice(5), n: Math.round((b.time || 0) / 60000) });
    }
    const maxN = Math.max(1, ...days.map((d) => d.n));
    const maxM = Math.max(1, ...mins.map((d) => d.n));

    // 错词榜
    const wrongCount = new Map();
    state.log.forEach((l) => {
      if (l.ok || !l.en) return;
      wrongCount.set(l.en, (wrongCount.get(l.en) || 0) + 1);
    });
    const topWrong = Array.from(wrongCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);

    // 总正确率
    let tr = 0, tw = 0;
    Object.values(state.srs).forEach((r) => { tr += r.right || 0; tw += r.wrong || 0; });
    const accAll = (tr + tw) ? Math.round((tr * 100) / (tr + tw)) : 0;

    $('#stats-body').innerHTML =
      '<div class="panel">' +
      '<div class="hero-row">' +
      '<div class="stat"><b>' + total + '</b><span>单词</span></div>' +
      '<div class="stat"><b>' + senses + '</b><span>释义</span></div>' +
      '<div class="stat hi"><b>' + (senses ? Math.round((mastered * 100) / senses) : 0) + '%</b><span>掌握度</span></div>' +
      '<div class="stat ' + (due ? 'warn' : '') + '"><b>' + due + '</b><span>待复习</span></div>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="row gap" style="font-size:13px;color:var(--muted)">' +
      '<span>今天练了 <b style="color:var(--text)">' + (today.seen || 0) + '</b> 次</span>' +
      '<span>今天时长 <b style="color:var(--text)">' + fmtDur(today.time) + '</b></span>' +
      '<span>累计时长 <b style="color:var(--text)">' + fmtDur(state.totalTime) + '</b></span>' +
      '<span>今天正确率 <b style="color:var(--text)">' + accToday + '%</b></span>' +
      '<span>累计正确率 <b style="color:var(--text)">' + accAll + '%</b></span>' +
      '<span>累计答对 <b style="color:var(--good)">' + tr + '</b> / 答错 <b style="color:var(--bad)">' + tw + '</b></span>' +
      '</div>' +
      '</div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>最近 7 天 · 答题次数</h2></div>' +
      '<div class="bars">' +
      days.map((d) => '<div class="bar-col"><span class="n">' + d.n + '</span>' +
        '<div class="b' + (d.n ? '' : ' zero') + '" style="height:' + Math.round((d.n / maxN) * 76) + '%"></div>' +
        '<span class="d">' + d.label + '</span></div>').join('') +
      '</div></div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>最近 7 天 · 学习时长（分钟）</h2></div>' +
      '<div class="bars">' +
      mins.map((d) => '<div class="bar-col"><span class="n">' + d.n + '</span>' +
        '<div class="b' + (d.n ? '' : ' zero') + '" style="height:' + Math.round((d.n / maxM) * 76) + '%"></div>' +
        '<span class="d">' + d.label + '</span></div>').join('') +
      '</div></div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>错得最多的词</h2><p>这些建议用「进阶」多打几遍</p></div>' +
      (topWrong.length
        ? '<div class="top-wrong">' + topWrong.map(([en, n]) => {
          const c = state.cards.find((x) => x.en === en);
          return '<div class="tw-row"><button class="speak" data-say="' + esc(en) + '">🔊</button>' +
            '<span class="w">' + esc(en) + '</span>' +
            '<span class="cn">' + esc(c && c.senses[0] ? c.senses[0].cn : '') + '</span>' +
            '<span class="n">错 ' + n + ' 次</span></div>';
        }).join('') + '</div>'
        : '<div class="empty" style="padding:20px">还没有错词记录</div>') +
      '</div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>构词法速查</h2><p>同源词不是同义词——别把 defend 和 defense 当一组背</p></div>' +
      '<div class="affix-list">' +
      AFFIXES.map((a) => '<div class="affix-row"><b>' + esc(a[0]) + '</b><span>' + esc(a[1]) + '</span></div>').join('') +
      '</div></div>' +

      '<div class="panel">' +
      '<div class="panel-head"><h2>数据</h2><p>数据只存在这台电脑的浏览器里，换设备请导出 JSON。</p></div>' +
      '<div class="row gap">' +
      '<button class="btn" id="btn-export2">导出全部数据</button>' +
      '<button class="btn ghost" id="btn-reset-progress">重置学习进度（保留单词）</button>' +
      '<button class="btn danger-ghost" id="btn-wipe">清空词库</button>' +
      '</div></div>';

    $('#btn-export2').onclick = exportJSON;
    $('#btn-reset-progress').onclick = () => {
      if (!confirm('清空所有学习记录（见过的次数、对错、复习计划），单词保留？')) return;
      state.srs = {}; state.seen = {}; state.log = []; state.daily = {};
      saveState(); renderStats(); updateTabBadge(); toast('学习进度已重置');
    };
    $('#btn-wipe').onclick = () => {
      if (!confirm('清空整个词库？这个不能撤销。')) return;
      state = emptyState();
      state.wiped = true;
      saveState(); renderStats(); updateTabBadge(); switchTab('import');
      toast('已清空');
    };
  }

  /* ============ 11. 启动 ============ */
  /** PWA：注册 service worker（只在线上跑） */
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  /** 手机上提示「添加到主屏幕」 */
  function maybeInstallTip() {
    try {
      if (localStorage.getItem('word.installTip') === '0') return;
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      if (standalone) return;
      const ua = navigator.userAgent;
      if (!/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return;
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      const el = document.createElement('div');
      el.className = 'install-tip';
      el.innerHTML =
        '<div class="it-text">' +
        (isIOS
          ? '点下面「分享」→「添加到主屏幕」，以后从图标进，进度就不会跑丢'
          : '点右上角 ⋮ →「安装应用」，以后从图标进，进度就不会跑丢') +
        '</div><button class="it-x" aria-label="关闭">✕</button>';
      document.body.appendChild(el);
      document.body.classList.add('has-install-tip');
      el.querySelector('.it-x').onclick = () => {
        localStorage.setItem('word.installTip', '0');
        el.remove();
        document.body.classList.remove('has-install-tip');
      };
    } catch (e) {}
  }

  function boot() {
    state = loadState();
    if (state._justSeeded) { delete state._justSeeded; saveState(); }
    // 老数据迁移：没有 ::n / ::h 后缀的记录，复制成普通 + 进阶两套
    let migrated = false;
    Object.keys(state.srs).forEach((k) => {
      if (/::[nh]$/.test(k)) return;
      const rec = state.srs[k];
      state.srs[k + '::n'] = Object.assign({}, rec);
      state.srs[k + '::h'] = Object.assign({}, rec);
      delete state.srs[k];
      migrated = true;
    });
    if (migrated) saveState();
    P.mode = MODES.concat([{ id: 'morph' }]).some((m) => m.id === state.settings.mode) ? state.settings.mode : 'sense';
    P.level = state.settings.level === 'hard' ? 'hard' : 'normal';
    P.limit = state.settings.limit || 20;

    $$('.tab').forEach((t) => { t.onclick = () => switchTab(t.dataset.tab); });
    bindImport();
    bindLibrary();
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('visibilitychange', () => { if (document.hidden) flushTime(); });
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]');
      if (b) { e.preventDefault(); speak(b.dataset.say); }
    });

    renderImportMeta();
    switchTab(state.cards.length ? 'practice' : 'import');
    registerSW();
    maybeInstallTip();
  }

  /* ============ 导出（供 node 测试） ============ */
  const API = {
    parseInput: parseInput,
    parseAny: parseAny,
    fromJSON: fromJSON,
    parseStructuredLines: parseStructuredLines,
    normalizeInput: normalizeInput,
    splitSenses: splitSenses,
    normCn: normCn,
    buildGroups: buildGroups,
    itemKey: itemKey,
    FAMILIES: FAMILIES,
    suggestSpelling: suggestSpelling,
    AFFIXES: AFFIXES,
    _internals: { shuffle: shuffle, scanPairs: scanPairs, textToSenses: textToSenses }
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  global.WordForge = API;

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
